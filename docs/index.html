ine changes - a checkbox is never ticked, and nothing in archived/ is overwritten; what cannot close (open criterion, open child, no Status line) is listed with the reason, by flow status before the final approval and by flow end after; --manter-docs skips it (#964). With an approved refinement, record --autonomo also accepts republishing the plan (refinement or card-enrichment) on the SAME card; refining a child card is a new plan and asks the developer, and a refusal names the real reason instead of always saying no refinement covers the card (#758, #782). The skill orchestrator decides and talks to the developer; this command only records, so the flow survives an interruption and every decision can be audited. One branch, one flow: .rbb/fluxo.json is versioned, carries a GUID of the flow and the branch it started on, and every mutating subcommand stages it, so whoever takes over the branch of another developer gets the approvals with it. Which session conducts it (CLAUDE_CODE_SESSION_ID, verified to be the same session_id hooks receive, including inside subagents) lives apart in .rbb/fluxo.local.json, ignored by git: a flow that arrived by checkout leaves the session free until rbb flow resume, because conducting is an act, not a side effect. A flow started on another branch only warns. The file leaves the branch before the PR (git rm), and an urgent demand goes to a new branch from develop, which is born without a flow. Staging that fails inside a repository warns: it is almost always an old .gitignore, which rbb sync all now completes. Each step is written when it happens, never at the end, and an approved step is never redone. A refusal or a return for missing input is written to the same routing ledger that rbb boards handoff uses, so one fact has one record; on the third refusal the flow stops and only an explicit decision of the developer dispatches that card again. Both also record on the step who it went to (--para), shown by status. A step without a card (--executa 1, a local key) has no routing ledger: a return is recorded on the step and exits 0, and a refusal exits 1 without recording anything, pointing to the return with --falta (#961). Approvals are recorded per transition, and autonomy is PROPOSED after five consecutive approvals without change, then confirmed by the developer in orchestration.autonomous inside the versioned project profile. Dispatching a skill at the wrong level of the breakdown is refused: the command reads the card type on the board, so refinement on an Epic is stopped and the answer names the step that was skipped. If the board does not answer, the dispatch goes through and the rule stays where it also lives, in the skill table. record --autonomo has a second basis besides a team-confirmed transition: an approved refinement in this flow covering the card of the step, walked up from the Task through the board; with the board down there is no proof and the question goes back to the developer. end refuses a flow that implemented code no approved code-review saw afterwards, unless the developer names the reason with --sem-revisao, recorded in the ledger. dispatch --ajuste passes the approved-step lock for a named reason (a review finding, a homologation divergence), and reopen brings a concluded flow back to active for that adjustment. Dispatch refuses an agent that does not exist in .claude/agents/ (#913). Dispatch with --decisao records the dev decision and restarts the refusal count for the card (#915). In mode local, dispatch --card also takes the local key (TE-001, TD-003.TASK-01) from rbb docs proximo: the step records the key instead of a null card, and the approved refinement of the item or of a parent declared in Pai covers its Tasks without a board (#940). A demand opens sized (#951): start --tipo demanda requires --porte P, M or G and --proposta with the minimal proposal the developer approved, which becomes step 1 (agent orchestrator, skill proposta, approved), so the po executes it with --executa 1; a bug takes neither. In a P or M flow, dispatch refuses backlog-breakdown and planning because the approved proposal already is the breakdown, also with --executa, and the refusal gives the publishing command, rbb flow dispatch --agente po --executa 1, without --skill (#960); --decisao from the developer passes and is recorded as guarda.forcada with rule porte-P or porte-M. status shows the size, and a flow recorded before it has none and behaves as G. In P and M, start also refuses a proposal without an Acceptance criteria section holding at least one list item, before recording anything: there is no backlog or planning, so the criteria of the card come only from the proposal (#962). Findings get triaged (#952): dispatch --ajuste on code (any skill outside backlog-breakdown, planning, refinement and card-enrichment, or none) requires --severidade blocker, warning or suggestion, and warning or suggestion also require --decisao with the choice of the developer. dispatch --executa n on the SAME unit (agent, skill and item) passes the approved-step lock, because publishing the approved plan is executing it. record --estacionado (repeatable) keeps an out-of-scope finding in the flow; status lists the Achados estacionados and end prints them last, for the developer to pick which become cards in another flow. record --resultado aprovada or aprovada-com-alteracao runs every --artefato under docs/<skill>/ whose schema carries confere-na-aprovacao through the same check as rbb skill verify, and a NAO CONFORME artifact is refused with its problems, so the orchestrator records rejeitada and dispatches again (#954). A schema without the marker, such as an old cache, is not checked. A folder without a schema of its own, such as docs/backlog/ of backlog-breakdown, is checked by the skill of the open step only when that skill declares the folder in grava-em, and a file that is not .md is skipped (#960); the backlog whose status line the refinement changed in mode local is not checked against the refinement contract (#963). dispatch prints the model and effort of the rule (haiku low for --executa; opus high for refinement M and G, planning, backlog-breakdown, architecture-review, security-review and complexidade:alta; haiku low for complexidade:baixa; sonnet medium otherwise), reading the complexidade tag from the card it already reads. A --modelo that differs with --origem regra warns and is recorded as divergente, never refused; --origem dev wins silently. rbb flow models opens with the rule and counts the divergences (#957). Without --modelo the step records the model of the rule with origin regra, so rbb flow models measures what ran instead of padrao-do-agente (#960). With the guard turned off on this machine (rbb guard off), start refuses and names both ways out, rbb guard on or --sem-guarda; with the flag the flow is born with semGuardaDesde and the ledger records guarda.forcada with rule fluxo-sem-guarda. The orchestrator turns the refusal into a question to the developer. dispatch marks a flow that arrived by checkout on a machine with the guard off, and status and end say the flow ran without guard; the mark stays after guard on, because it is history (#966).',   usage:'rbb flow start "<pedido>" --tipo demanda --porte P|M|G --proposta .rbb/proposta.md [--sem-guarda]  ·  rbb flow dispatch --agente <a> [--card <id>] [--ajuste "<o que>" --severidade blocker]  ·  rbb flow record --resultado <r> --estacionado "<achado>"  ·  rbb flow record --resultado <r> [--proximo <a>] [--autonomo --nota "<desvio>"]  ·  rbb flow status|pause|resume  ·  rbb flow reopen --motivo "<divergencia>"  ·  rbb flow end [--sem-revisao "<motivo>"]  ·  rbb flow autonomy [--confirmar po>tech-lead]',   prereq:null, tags:['orquestrador','fluxo','aprovacao','autonomia'] },
  { id:'guild',           type:'cli', isNew:true, group:'utils',  groupLabel:'Utilities',   name:'rbb guild',           desc:'Mostra o que a plataforma é, o que existe aqui e em que pé está a adoção deste repositório, tudo derivado do disco.',                      detail:'Deriva as skills das pastas de skills/, os agentes do frontmatter, os comandos do proprio commander e o estado da adocao dos arquivos em .rbb/ e .claude/. Nada aqui e lista escrita a mao, entao uma skill nova aparece no instante em que a pasta existe. Com --json, serve de fonte para a skill guild-help, que assim nao precisa manter inventario proprio.',                                                                                                                                                                                               usage:'rbb guild [--json]',                                              prereq:null, tags:['onboarding','inventario','adocao'] },
  { id:'docs-proximo', type:'cli', group:'utils', groupLabel:'Utilities', name:'rbb docs proximo', isNew:true, desc:'Devolve a próxima chave local de um tipo (EP, FT, US, TE, TD, BUG), olhando todas as branches conhecidas.',detail:'In mode local an item had no number, so its documents carried a date and one day served many items (#945). The key is TYPE-NNN (TD-003), a Task is ITEM.TASK-NN. The CLI allocates it because an agent cannot see the other branches: two branches opened from the same develop drew the same key. It takes the highest number in use across every local and remote ref plus the disk, adds one, and never fills a gap. The key goes to stdout and the rest to stderr, so it works inside a command substitution; --fetch updates the remotes first, --json prints chave, maior and refs. Refuses in mode azure (the key is the card number) and when the mode is not declared.',usage:'rbb docs proximo td  ·  rbb docs proximo us --fetch --json',prereq:'.rbb/boards.json com mode local', tags:['local','key','lineage'] },
  { id:'docs-arvore', type:'cli', group:'utils', groupLabel:'Utilities', name:'rbb docs arvore', isNew:true, desc:'Mostra a árvore de trabalho EP, FT e item a partir de docs/, ou o caminho da raiz até uma chave.',detail:'Reads the declarations (> **Chave**: TD-003 and, optionally, **Pai**: FT-002) under docs/ and draws the lineage EP, FT, item, with the title of each and the documents whose name carries the key. With a key it prints the path from the root to it and its sub-tree. Items whose parent does not exist are listed apart as without parent (#945).',usage:'rbb docs arvore  ·  rbb docs arvore TD-003',prereq:'.rbb/boards.json com mode local', tags:['local','key','lineage'] },
  { id:'docs-checar', type:'cli', group:'utils', groupLabel:'Utilities', name:'rbb docs checar', isNew:true, desc:'Acusa chave local declarada em mais de um lugar, pai inexistente e documento com chave no nome sem declaração.',detail:'A key declared in two places exits 1 and lists each file and line; a missing parent and a document whose name carries a key with no declaration are warnings and exit 0. rbb doctor reports the same collision as an error in mode local (#945).',usage:'rbb docs checar  ·  rbb docs checar --json',prereq:'.rbb/boards.json com mode local', tags:['local','key','gate'] },
  { id:'doctor',          type:'cli', group:'utils',  groupLabel:'Utilities',   name:'rbb doctor',          desc:'Verifica se as ferramentas necessárias estão instaladas: Git, Node.js, Docker, .NET e Azure CLI.',                      detail:'With --project it also checks local state tracked in .rbb/ (events, ledger, resume that entered git) and points a libs-only drift to rbb profile refresh instead of a full rescan (#925).',                                                                                                                                                                                               usage:'rbb doctor',                                                      prereq:null, tags:['environment','tools','setup'] },
  { id:'agents',          type:'cli', group:'utils',  groupLabel:'Utilities',   name:'rbb agents derive',   desc:'Deriva um agente dev por camada da arquitetura a partir do .rbb/project.yaml, cada um com a própria fronteira de escrita.',detail:'Reads architecture.layers[].depends_on and produces the implementation order for THIS project by topological sort — replacing the hardcoded Domain to Application to Infrastructure to API sequence, which only holds for .NET Clean Architecture. Layers that nothing depends on (typically tests) are placed last rather than first. Each generated agent carries owns / reads / never_touches from scopes, falling back to paths when scopes is absent, plus the build, test and lint commands of its own layer (architecture.layers[].commands, #833), falling back to the conventions ones: in a fullstack the global commands belong to one stack only, and the frontend agent used to receive dotnet build. A dependency cycle fails loudly instead of picking an arbitrary order, and so does a path owned by two agents: with two owners the write guard picks one and blocks the other inside its own owns, so nothing is written until the profile gives each path a single owner (#902). Nested boundaries are fine, the most specific wins. A scope is read from dev-<layer> or <layer>; a dev-* scope with no matching layer is reported, because the boundary written there applies to nobody (#832). Layer names in reads and never_touches resolve to the layer path. Without a tests layer, the folders of conventions.test_project named after a layer join that layer owns, so the guard and the agent apply the same rule to the layer tests (#830). A tests or tests-* layer does not become an agent: its path, plus the owns of its scope, goes to the Testes da sua camada of every dev-<layer>, who write the tests of what they implement. It is not an overlap, and a test path already in the declared owns of a code scope stays with that scope (#956). The guard, the derive and the doctor derive the same team from disk. Each derived agent carries the platform protocol (return, refusal/devolution, opening, closing) resolved from the synced canonical blocks (#920). It installs or updates the guard hooks first, even when there is nothing to derive (no profile, no layers) (#924). Files are marked as generated: rerunning replaces only what it wrote, never a hand-authored agent. Each agent is also specialized by CONTENT, sliced per layer: only the libs whose example files fall inside its boundary, and only the subdomains that cross it. The glossary is deliberately NOT sliced and is embedded inline rather than referenced — the naming gate fires every time something is named, so a pointer would arrive after the name was already chosen. --dry-run does not touch the disk: it used to delete the generated agents before saying nothing was written (#905). The doctor and guard status report a layer whose generated agent is missing from .claude/agents, including the case where all of them are missing.',usage:'rbb agents derive [--dry-run]',                                   prereq:'.rbb/project.yaml with architecture.layered: true', tags:['agents','team','layers','profile'] },
  { id:'cli-feedback',    type:'cli', group:'utils',  groupLabel:'Utilities',   name:'rbb feedback',        desc:'Registra o que um agente ou uma skill fez de errado e, quando existe regra mecânica, impede que aconteça de novo neste projeto.',detail:'The platform measured cost (`rbb metrics`) and trajectory (`rbb judge`); both only see what a log can show. Neither notices that a skill did something technically correct and useless, or that an agent kept pushing a path the developer had already rejected. That judgement exists only in the head of whoever was there — and without a channel it becomes a habit of working around the tool rather than a correction to it. Feedback has two halves and mixing them kills the second: REPORTING becomes a Technical Debt card on the platform board; BLOCKING becomes a rule in .rbb/project.yaml that takes effect on the next run. Two rules have mechanical teeth today — a forbidden term goes to glossary never_use (enforced by the naming gate embedded in every derived agent) and a path goes to scopes never_touches (enforced by the write guard, which answers exit 2). Outside those two the command says so plainly instead of accepting --barrar and blocking nothing, because promising enforcement that does not exist is worse than not offering it. Evidence is stamped by the CLI, never typed: head from git, agent from the delegation marker, paths from git status, guard events from the ledger — a caller-supplied value is discarded, same rule as `rbb resume seal`. Nothing carrying client file content is allowed to leave: push refuses records with fenced code or a long line matching a file named in the evidence, and attachments are explicit opt-in. Push is idempotent: a record already on the board (tag fb-<hash> or, for older cards, same title and record id) is marked as sent and no card is created (#949). Without the platform board, as for whoever adopted the Guild with only the feed, push turns the record into a PUBLIC issue on the public Guild repository (#970): it first prints the public body (description, expected, skill, agent, CLI version and record id; never head, paths, events, attachments or the local rule target) and sends only with --publico. With gh logged in it searches the fb-<hash> mark and creates the issue only if absent; without gh it opens the 1-problema form prefilled in the browser. No label is sent: a triage Action in that repository applies them. The queue lives in .rbb/feedback until sent, so a network failure never loses the feedback from the bad day. And the highest-value feedback needs no discipline at all — every --force is already in the ledger, and repeated refusals on the same path mean either the agent is insisting or the boundary is wrong; both are offered as candidates.',usage:'rbb feedback  ·  rbb feedback new --tipo erro --titulo "..." --descricao "..." --esperado "..."  ·  rbb feedback push  ·  rbb feedback push --publico',   prereq:'Com board da plataforma, PAT resolvível; sem ele, o gh logado ou um navegador; o registro local funciona sem nada disso', tags:['feedback','evidence','guard','AP-010'] },
  { id:'boards-features', type:'cli', group:'boards', groupLabel:'Azure Boards', name:'rbb boards features',  desc:'Mostra a árvore de Épico e Features, para a skill escolher um pai ao criar um card em vez de adivinhar.',detail:'The tree comes from a query of Epics and Features only, with no cap: it used to reuse the 50 most recent items of any type, so an old Epic fell outside the cut and its Features were listed as orphans (#749). A Feature whose Epic is closed shows which parent it has. Answers the question every skill asks before creating a standalone card: which Feature does this fall under? Without a cheap answer there are only two bad paths — the skill guesses a parent and cards end up orphaned, invisible in the hierarchy and in epic reports, resurfacing months later with nobody knowing where they came from; or it asks the developer everything, who opens the board in another tab and types back what the tool could have read. Discovering this before meant one `boards list --parent` per epic, and knowing the epics up front. Closed items are hidden by default since you rarely parent new work into them, and an orphan Feature is listed under a placeholder rather than dropped — hiding it would make the tree lie by omission, and an orphan Feature is exactly the case that needs attention.',usage:'rbb boards features  ·  rbb boards features --all',   prereq:'.rbb/boards.json com mode azure', tags:['board','hierarquia','parent'] },
  { id:'guard',           type:'cli', group:'utils',  groupLabel:'Utilities',   name:'rbb guard',         desc:'Transforma a fronteira de escrita dos agentes derivados de frase em bloqueio mecânico, aplicado por um hook de PreToolUse.',detail:'`rbb agents derive` writes into every agent a line saying "You do NOT touch: src/App.Api/". Until now that was AP-010 inside the platform own output — the only consequence of crossing was having read a warning. The board guards live in the CLI because the CLI is the only path to Azure Boards; file writes have no such chokepoint, so a hook is the only mechanism available. The guarantee comes from the boundary and the sentence sharing one derivation: the AgenteDerivado that renderizarAgente turns into prose is the same object the guard consults, so they cannot drift. Who is writing comes from the write payload itself: agent_type reaches every subagent event, so attribution is exact even with two delegations open at once. The old delegation marker, opened on dispatch and cleared on SubagentStop, was inference and went ambiguous under parallel delegations, which meant an inert guard; it stays only as a fallback for older Claude Code versions, and the ledger records which of the two decided. Writes are then evaluated against that layer territory. Nested boundaries resolve by the most specific match, and a neighbour that merely shares a prefix (src/App.ApiClient next to src/App.Api) belongs to nobody rather than to the wrong layer. It deliberately does NOT confine an agent to its own directory: package.json and scripts pass, because a guard that blocks legitimate work gets switched off, and a guard switched off protects nothing. What it stops is crossing a DECLARED boundary. Every refusal is appended to .rbb/events.jsonl, so it becomes evidence the trajectory judge can cite; cases where it could not decide (no profile, concurrent delegations) are recorded too — silence would look like approval. Runs as a separate lean binary: 0.23s per write against 0.88s for the full CLI. Registered is not working: for six weeks the hook answered command not found in 309 of 309 real executions, because rbb-guard was never on PATH, and Claude Code lets every write through on that error. So install and status now run the registered command through the same shell Claude Code uses, and send a ping only this binary answers; a missing or outdated rbb-guard turns status red. The matcher written to settings.json is derived from the same tool list the runtime uses: the old one was typed by hand, left Bash out, and 2237 shell calls in two real projects never reached the guard. Reinstalling updates the matcher of an existing entry instead of skipping it. The shell is the path that bypasses every other guard, so a subagent shell command is judged on its own (#727, #728): consolidating in git (commit, push, PR, tag), git that rewrites the shared working tree (stash, checkout, switch, reset, restore, clean, rebase, merge, cherry-pick), and writing files through the shell (redirection, sed -i, tee, Set-Content, inline or heredoc scripts calling open/write_text/writeFile/WriteAllText) are refused with the alternative. Quotes and heredoc bodies are stripped first, so 2>&1, arrows and commit messages are not false positives. A script already on disk that writes internally is not visible on the command line and is not caught. The generic dev agent the platform ships is not part of a derived team, so its writes used to fall into agente-fora-do-time and pass without any boundary; in a project with a layered team, a write by dev inside the territory of a layer that has an owner is now refused and names that owner (#733). Status exits 0 for a project without layers when the hooks are complete and the binary answers, and doctor --project checks the guard in every project that has .claude, hooks registered and responding (#924). During an active flow, the conducting session cannot write outside .rbb/ through the shell either (redirection, Set-Content, tee), not just through Write and Edit (#910). Shell writes by a subagent are judged by destination with the same territory rule as Write/Edit; outside the project root is free; git global options, the dist entry point and --force on board transitions do not bypass the guard (#930). qa, po, tech-lead and designer are refused inside a layer territory; path comparison ignores case on Windows and macOS (#931). Install also adds narrow allow rules for rbb boards, flow and feedback to permissions.allow, so auto mode does not deny the board writes the platform needs; the guard still blocks force flags from agents (#932). guard off turns the guard off on this machine only, without touching the versioned settings.json: it writes .rbb/guarda-desligada.json (ignored by git), and rbb-guard reads it right after the ping and answers exit 0 to every event, writing nothing (no ledger line, no delegation marker, no session anchor). The ping still answers, so status shows desligada por voce desde <date> and is not a defect. guard on removes the flag and the leftover delegation marker. Both record guarda.desligada and guarda.ligada through the CLI, and both answer nada mudou with exit 0 when there is nothing to change. guard off with a flow open marks the flow as running without guard (#966).',usage:'rbb guard install  ·  rbb guard status  ·  rbb guard off|on  ·  rbb guard check <path> --agent dev-domain',   prereq:'.rbb/project.yaml with architecture.layered: true', tags:['guard','hooks','boundary','agents','AP-010'] },
  { id:'profile',         type:'cli', group:'utils',  groupLabel:'Utilities',   name:'rbb profile refresh', desc:'Mantém o perfil do projeto em dia com o código na parte que um programa consegue verificar: as dependências declaradas.',detail:'The profile describes the project, and the project changes. Nothing was updating it: no CLI code writes .rbb/project.yaml, and of the skills that mention it only codebase-analysis produces it, in a full scan. So it becomes a photograph the whole platform consults as if it were today — measured on a real project, 74 dependencies existed in the code and none in the profile, while the doctor could only suggest a complete rescan to fix a list the CLI itself knows how to read. The boundary this command respects is NOT human versus machine: the profile contract already says it is regenerated, not hand-edited. The boundary is objectively verifiable versus judgement. Libraries declared in stack manifests are verifiable, so they are reconciled. The prose role of each layer, the glossary never_use, subdomain confidence — those a program scan does not improve, it DEGRADES, swapping considered text for shallow inference; they stay untouched and remain the work of codebase-analysis, and the command says so rather than pretending it finished the job. An existing entry is preserved whole when its library is still in the project, because used_as and example_files describe HOW a library is used, which is reading code and not a manifest. A new entry is born with the name alone: inventing how it is used would be the profile lying, which is the first inviolable rule. An unrecognised stack refuses to act instead of emptying the list — not knowing how to read is different from finding nothing, and whoever cannot read cannot conclude the profile is wrong.',usage:'rbb profile refresh  ·  rbb profile refresh --dry-run',   prereq:'.rbb/project.yaml presente', tags:['profile','drift','libs','freshness'] },
  { id:'metrics',         type:'cli', group:'utils',  groupLabel:'Utilities',   name:'rbb metrics',      desc:'Reporta o custo real de token a partir das transcrições, ponderado por categoria em vez de somado num número só.',detail:'Reads the actual usage recorded per model response, so the numbers are measured rather than estimated. It refuses two shortcuts that would turn the report into self-justification: it never sums tokens into a single figure (a cached read costs a tenth of fresh input and output costs five times as much, so a raw total would make the platform look cheap whenever the cache worked), and it never converts to money (prices change, ratios between categories do not — the unit is input-token equivalents). Cache writes are split by TTL because the one-hour write costs 2x and the five-minute one 1.25x; treating them alike misprices by 60 percent. Net cache saving can come out NEGATIVE when a cache is written and seldom read, and the report says so — a metric that can only confirm is not a measurement. It also states plainly what it cannot answer: cost alone never decides, since the cheapest agent is the one that does nothing.',usage:'rbb metrics [--dias 7] [--por dia|modelo|projeto] [--todos]',   prereq:null, tags:['cost','tokens','measurement','cache'] },
  { id:'knowledge',       type:'cli', group:'utils',  groupLabel:'Utilities',   name:'rbb knowledge',       desc:'Índice consultável das análises já escritas em docs/, derivado dos documentos e nunca uma segunda cópia deles.',detail:'It answers the question a session asks before repeating work someone already did: have we touched this before? Until now the only way to find out was to read docs/bugfix-notes/ in full — twenty-six files, 170 KB, to use one. The platform measured its own cost (docs/metrics/baseline_20260804.md) and found the dominant line is CACHE READ, not fresh input: the waste is not the size of each artifact, it is how many artifacts enter the context to locate one. Measured on a real project, the index costs 0.9 KB to decide what to read instead of 170 KB — 194x less to decide, 6.4x less counting the documents actually opened. This is deliberately NOT a replacement for the markdown. The document stays versioned in docs/: reviewable in a PR, diffable, surviving a board migration, identical in mode local. The index is a projection of the header fields those documents already carry, regenerated whole on every run — so it cannot drift, and a stale entry pointing at a deleted file never survives. It is the board-adoption principle inverted: there the markdown is a VIEW of the JSON; here the JSON is a view of the markdown. Search demands ALL terms rather than any, because thirty partially relevant hits recreate the very problem the index exists to remove, and placeholders from the skill template are skipped so a search never returns the blank form instead of the real case. docs/todos/ is excluded on purpose: a ToDo is state, or scaffolding, and indexing it would fill the search with pending work instead of learning.',usage:'rbb knowledge index  ·  rbb knowledge search pdf download  ·  rbb knowledge search --json',   prereq:'documentos de análise com cabeçalho de campos (`> **Card**:`, `> **Causa raiz**:`)', tags:['knowledge','retrieval','cache','tokens','docs'] },
  { id:'judge',           type:'cli', group:'utils',  groupLabel:'Utilities',   name:'rbb judge',           desc:'Avalia a TRAJETÓRIA contra uma rubrica: não o artefato, mas se o trabalho foi feito do jeito certo.',detail:'Everything else the platform checks looks at artifacts: the file exists, the hash matches, the card has an open child. Nothing looked at the path taken. This does, and it is the quality counterpart to `rbb metrics` — cost falling while rework rises is a regression, and neither number sees that alone. The rubric splits in two. Mechanical criteria (M1..M5) are decided by code from `.rbb/events.jsonl`, where the board guards now RECORD their refusals instead of only printing them: sessions sealed, guards bypassed with --force, guards that were switched off, forbidden glossary terms in changed files, sessions per card as a rework proxy. Judgement criteria (J1..J6) genuinely need reading, so they go to an LLM — but the CLI never calls one. It emits a stamped dossier, the agent answers in JSON, and the CLI VERIFIES: every verdict must quote a passage that appears literally in the dossier, from the section that criterion declares as its source. A verdict that fails verification is discarded, not accepted with a caveat, and discarding lowers the coverage figure. That is the point — an LLM judge is prose evaluating prose, which is AP-010 committed inside the measuring instrument, and asking it nicely to cite evidence would be the same scar one level down. `sem evidência` is never approval: with nothing recorded the report says it saw nothing rather than passing by omission.',usage:'rbb judge [--dias 7]  ·  rbb judge --dossie > d.md  ·  rbb judge --aferir resp.json --contra d.md',   prereq:null, tags:['trajectory','rubric','evidence','quality','AP-010'] },
  { id:'resume',          type:'cli', group:'utils',  groupLabel:'Utilities',   name:'rbb resume',       desc:'Lê a âncora de sessão (.rbb/resume.md) e diz, por arquivo de origem, se o estado registrado ainda vale.',detail:'A skill that pauses writes the anchor: what it decided, where it stopped, and which files it summarized. On the next session the command re-hashes each declared source and returns a per-source verdict — unchanged files can be skipped, changed files must be re-read. The agent never writes the hashes: `rbb resume seal` stamps them, so the freshness guard cannot be faked. Verdicts: FRESCA, PARCIAL, OBSOLETA, INVÁLIDA, SEM ÂNCORA. The anchor reaches the session on its own: `rbb guard install` registers SessionStart, PreCompact and SessionEnd, and every session start receives the verdict in its context, including a loud warning when the anchor belongs to another card. PreCompact records the moment and NEVER seals: sealing re-hashes the sources, and an automatic seal over an old narrative would make it pass as fresh. The seal also stamps the gate result (conventions.test_command from the profile, or --gate), so resuming from a red state is visible.',usage:'rbb resume  ·  rbb resume seal [--gate <comando>] [--sem-gate]',                                   prereq:null, tags:['session','context','anchor','tokens'] },
  { id:'update',          type:'cli', group:'utils',  groupLabel:'Utilities',   name:'rbb update',       desc:'Atualiza o CLI para a versão mais recente publicada no feed configurado.',detail:'Compares current version with the latest release, downloads the .tgz via gh release download, installs with npm install -g, and removes the temporary file. Use --force to reinstall the same version.',usage:'rbb update [--force]',                                             prereq:'gh CLI installed and authenticated', tags:['update','version','github'] },
  { id:'catalog', type:'cli', group:'utils', groupLabel:'Utilities', name:'rbb catalog', isNew:true, desc:'Abre o catálogo de skills, comandos e agentes da versão instalada, sem precisar do repositório Guild.',detail:'The catalog used to exist only in the Guild repository, so whoever installed the CLI from the feed had no way to open it. The build copies docs/catalog.html into dist/, which already ships in the package, so the catalog arrives with the installed version and shows what that version has, not what main has today. Without options it prints the path and opens the default browser (cmd start on Windows, open on macOS, xdg-open on Linux); --caminho prints only the absolute path, for an agent, CI or another browser. A CLI built before the command answers with a pointer to rbb update. The catalog moves to the company site when the site is restructured (#947).',usage:'rbb catalog  ·  rbb catalog --caminho',prereq:null, tags:['catalog','help','docs'] },
  { id:'version',         type:'cli', group:'utils',  groupLabel:'Utilities',   name:'rbb version',         desc:'Mostra a versão do CLI e, com --verificar, confere o CLI e as skills do projeto contra o que está publicado.', detail:'Without options it prints the installed version. --verificar compares the CLI with the feed and the project skills sha with the platform branch (git ls-remote), prints one line each and always exits 0: no network, no feed or no sync is reported as not verified, never as an error (#946). The remote part is cached for 24 h in ~/.rbb/versao.json and a failed query is not retried for an hour. --json adds perguntar, already discounting the deferral, which the orchestrator reads before rbb flow start. --adiar records the newest known version so the question only returns when a newer one is published.', usage:'rbb version  ·  rbb version --verificar [--json]  ·  rbb version --adiar',                                                     prereq:null, tags:['version','info'] },
  { id:'help',            type:'cli', group:'utils',  groupLabel:'Utilities',   name:'rbb help',            desc:'Lista todos os comandos disponíveis com uma descrição curta. Passe --help em qualquer subcomando para os detalhes.',             detail:null,                                                                                                                                                                                               usage:'rbb help',                                                        prereq:null, tags:['help','commands'] },
  { id:'skill-list',      type:'cli', group:'utils',  groupLabel:'Utilities',   name:'rbb skill list',      desc:'Lista as skills disponíveis localmente no cache, depois de rodar o sync.',                          detail:null,                                                                                                                                                                                               usage:'rbb skill list',                                                  prereq:'rbb sync skills executed', tags:['skills','list'] },
  { id:'boards-finish',   type:'cli', group:'boards', groupLabel:'Azure Boards',name:'rbb boards finish',   desc:'Move um card para o estado concluído, pelas mesmas guardas do start, e recusa enquanto houver filho em aberto.',detail:'The counterpart of boards start. It REFUSES to close a card that still has an open child, of any type: the Tasks ARE the work, so a card done with an open Task is never right - either the work did not finish, or the Task should not exist and is removed on purpose, not closed on the side. It used to cascade and close every child Task itself, which closed the Tasks of other agents whose work never happened: in a container with seven Tasks, one agent finished its four and the command would have closed the two that belonged to another. The board then states work nobody did, and a board that lies is worse than one that is out of date. A Removed child counts as closed, otherwise the guard would block the very exit it recommends. The escape hatch is --force, recorded in .rbb/events.jsonl. The walk follows the type process order (User Story and Bug have Approve before Done) and never crosses Approve on the way to another state (#907).',usage:'rbb boards finish <id>  ·  rbb boards finish <id> --force',   prereq:'.rbb/boards.json com mode azure', tags:['board','state','guard','children'] },
  { id:'boards-children', type:'cli', group:'boards', groupLabel:'Azure Boards',name:'rbb boards children',  desc:'Lista os filhos de um card, para a alçada ser decidida por filho e não no contêiner.',detail:'A container card spans work of different natures - investigation, configuration, mitigation - so the question which agent owns this card has no answer, while which agent owns this Task does. Agents used to judge the parent by one acceptance criterion and refuse it, without ever looking down: in the case that created this command, every child Task belonged to the agent that had just refused the parent. The output says so explicitly, and lists each child with its type and state.',usage:'rbb boards children <id>',   prereq:'.rbb/boards.json com mode azure', tags:['board','hierarchy','routing','ownership'] },
  { id:'boards-handoff',  type:'cli', group:'boards', groupLabel:'Azure Boards',name:'rbb boards handoff',   desc:'Mostra quem já recusou um card e o que isso proíbe, registra recusa ou devolução por falta de insumo, e para o roteamento na terceira recusa.',detail:'Four agents once refused the same card in sequence, each pointing to the next, closing a cycle and leaving the developer with nobody to call. Refusals lived only in the chat, so the next agent could not know others had already refused. This command makes the history queryable: an agent that already refused cannot refuse again, and an agent that finds others refused cannot point back to any of them. Recording a refusal requires --para, because a refusal without a destination is a dead end and a dead end becomes a cycle. During a batch, an agent that meets a child outside its scope records the skip here instead of stopping the whole run.',usage:'rbb boards handoff <id> --agente <nome>  ·  rbb boards handoff <id> --agente <nome> --recusar --para <destino> --motivo "..."  ·  rbb boards handoff <id> --agente <nome> --devolver --para <quem completa> --falta "..."',   prereq:'.rbb/boards.json com mode azure', tags:['board','routing','refusal','cycle'] },
  { id:'skill-contracts', type:'cli', group:'utils',  groupLabel:'Utilities',   name:'rbb skill contracts',  desc:'Mostra quanto de cada output-schema de skill o verificador consegue de fato cobrar.',detail:'rbb skill verify derives its contract from the markdown blocks of each output-schema: every level-two heading becomes a required section. This command lists, per skill, how many sections were derived, and flags the skills whose schema yields no contract at all. A skill that legitimately produces no markdown artifact declares it and is not counted as debt. It is what keeps the schema_nao_derivavel ratchet honest, and it is also where a silently truncated contract shows up: a nested code fence once cut the bug-triage contract from four sections to three, and this count was the evidence.',usage:'rbb skill contracts  ·  rbb skill contracts --max 0',   prereq:null, tags:['skills','contract','validation','schema'] },
  { id:'skill-verify',    type:'cli', group:'utils',  groupLabel:'Utilities',   name:'rbb skill verify',    desc:'Confere um artefato produzido contra o output-schema que a skill declara. É a primeira coisa que olha o que a skill realmente gerou.',detail:'The structural gate validates the platform own files; the trajectory judge evaluates the path taken. Between them nothing looked at the ARTIFACT: did skill X, having run, produce something valid? The contract for that already existed and no program read it — every skill declares output-schema.md. It is DERIVED here rather than retyped into a JSON, because two lists of required sections diverge on day one. What it catches: a section the schema declares and the document lacks, a section with a heading and nothing under it, a template placeholder like [Nome] that survived, and the raw {{include:}} marker that means the skill ran against stale canonical sources. What it deliberately does NOT catch: shallow content — an artifact with every section present and thin analysis passes, and the output says so, because a CONFORME the developer reads as "this is good" would be worse than no check at all. A skill whose schema yields no derivable contract reports NÃO VERIFICÁVEL and exits 3 instead of green: passing because there was nothing to check looks identical to passing. `rbb skill contracts --max n` freezes that blindness as debt that can only shrink. Calibrated on two golden fixtures — one correct artifact that must pass, one with a planted defect of each kind that must fail. A file name outside the convention is flagged: the key is the date, or the card number in mode azure (refinement_737.01.md, #745). Three schema markers extend the contract without code (#954): teto-palavras P=600 M=1200 G=2500 caps the words of the whole artifact, code blocks included, by the size the artifact declares in its Porte header (porte-ausente without it, acima-do-teto with the count and the cap); max-itens <section> = N caps the top-level list items of a section (itens-demais); and confere-na-aprovacao makes rbb flow record check the artifact when it is approved.',usage:'rbb skill verify docs/refinement/refinement_737.01.md  ·  rbb skill contracts --max 5',   prereq:'rbb sync skills executed', tags:['skills','output','schema','validation','AP-013'] }
];

    detail:'CI/CD workflows for backend, frontend, and fullstack. Reusable infrastructure modules: JWT auth, Application Insights, structured logging, database (PostgreSQL/MongoDB), autoscaling with KEDA. Shared scripts and deployment documentation. flow-out-of-pr.yml is the pull request gate for develop and main: it installs rbb from the platform feed (secret RBB_FEED_PAT, Packaging Read) and runs rbb flow check-pr, the same check as the Verify stage of the Azure Pipelines template (#831, #898). It only blocks a merge once branch protection requires it.',
    stack:'Azure Container Apps, GitHub Actions, Docker, Bicep',
    files:['.github/workflows/', 'modules/', 'backend/', 'frontend/', 'fullstack/', 'shared/', 'docs/'],
    steps:['Copy modules to the project', 'Configure secrets in GitHub', 'Push to main branch'],
    usage:'rbb init -l  # select devops/azure',
    skill:'cicd',
    tags:['azure','devops','ci/cd','container apps','github actions','keda']
  }
];

const AGENTS = [
  { id:'agent-dev', type:'agent', name:'dev',
    role:'Senior Developer',
    desc:'Executa todo o trabalho de código: implementação de features, correção de bugs e criação de projetos.',
    detail:'Opens from the card, not from the folder: the card with its Discussion, the parent, the refinement of that card and the code map (#955, AP-009). A whole docs/ folder is read only when the dev asks. Applies archive and prioritization conventions automatically after each completed task.',
    skills:['implementation','bugfix','backend-bootstrap','frontend-bootstrap'],
    usage:'@.claude/agents/dev.md',
    tags:['dev','coding','implementation','bugfix'] },
  { id:'agent-tech-lead', type:'agent', name:'tech-lead',
    role:'Tech Lead & Architect',
    desc:'Conduz o planejamento técnico, as decisões de arquitetura e a documentação para desenvolvedores.',
    detail:'Orchestrates the full planning lifecycle: refines feature requests into technical specs, reviews architecture, and keeps project documentation current. Prioritization belongs to the po, and code review to the qa.',
    skills:['refinement','architecture-review','codebase-map','documentation','housekeeping','feedback'],
    usage:'@.claude/agents/tech-lead.md',
    tags:['architecture','planning','refinement','documentation'] },
  { id:'agent-po', type:'agent', name:'po',
    role:'Product Owner',
    desc:'É dono do backlog de produto, da ideia crua ao item pronto para desenvolvimento.',
    detail:'Runs discovery sessions, breaks backlogs into epics and user stories, and routes completed todos. Bridges business needs and technical execution.',
    skills:['project-discovery','backlog-breakdown','planning','prioritization','resolve-todo','board-adoption','card-enrichment'],
    usage:'@.claude/agents/po.md',
    tags:['product','discovery','backlog','todos'] },
  { id:'agent-qa', type:'agent', name:'qa',
    role:'QA & Security Engineer',
    desc:'Revisa qualidade de código, postura de segurança e faz análise profunda de codebase.',
    detail:'Covers the full quality spectrum: code review, security vulnerability scanning, bug triage, and comprehensive codebase analysis for undocumented projects.',
    skills:['code-review','security-review','bug-triage','troubleshoot','codebase-analysis','user-guide'],
    usage:'@.claude/agents/qa.md',
    tags:['quality','security','review','testing'] },
  { id:'agent-devops', type:'agent', name:'devops',
    role:'DevOps Engineer',
    desc:'Desenha pipelines de CI/CD em qualquer provedor e instala, atualiza e explica o Guild nos repositórios.',
    detail:'Guides through a structured questionnaire (8 groups) to generate a complete, provider-agnostic pipeline. Also installs, upgrades and explains the Guild in a repository (guild-init, guild-upgrade, guild-help). Releases run in the dev session, never delegated.',
    skills:['cicd','guild-init','guild-upgrade','guild-help'],
    usage:'@.claude/agents/devops.md',
    tags:['devops','ci/cd','pipeline','release'] },
  { id:'agent-designer', type:'agent', name:'designer',
    role:'UI/UX & Brand Designer',
    desc:'Cria identidade de marca e design de interface conforme a linguagem visual do projeto.',
    detail:'Generates complete brand identity assets (logo guidelines, color palette, typography, voice) and produces detailed UI designs with component specs and interaction notes.',
    skills:['brand-identity','ui-design'],
    usage:'@.claude/agents/designer.md',
    tags:['design','brand','ui','ux'] }
];

/* ─── State ── */
let activeTab = 'all';
let activeCategory = 'all';
let searchQuery = '';

const SKILL_CHIPS    = [{cat:'all',label:'All'},{cat:'discovery',label:'Discovery'},{cat:'planning',label:'Planning'},{cat:'dev',label:'Development'},{cat:'review',label:'Review'},{cat:'debug',label:'Debug'},{cat:'delivery',label:'Delivery'}];
const CLI_CHIPS      = [{cat:'all',label:'All'},{cat:'init',label:'Projects'},{cat:'sync',label:'Sync'},{cat:'boards',label:'Azure Boards'},{cat:'utils',label:'Utilities'}];
const TEMPLATE_CHIPS = [{cat:'all',label:'All'},{cat:'tbackend',label:'Backend'},{cat:'tfrontend',label:'Frontend'},{cat:'tfullstack',label:'Fullstack'},{cat:'tdevops',label:'DevOps'}];
const AGENT_CHIPS    = [{cat:'all',label:'All'}];

/* ─── Render ── */
const COPY_ICON = `<svg width="12" height="12" viewBox="0 0 15 15" fill="currentColor"><path d="M1 9.5A1.5 1.5 0 0 0 2.5 11H4v-1H2.5a.5.5 0 0 1-.5-.5v-7a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 .5.5V4H11V2.5A1.5 1.5 0 0 0 9.5 1h-7A1.5 1.5 0 0 0 1 2.5v7Zm5-4A1.5 1.5 0 0 0 4.5 7v5A1.5 1.5 0 0 0 6 13.5h7A1.5 1.5 0 0 0 14.5 12V7A1.5 1.5 0 0 0 13 5.5H6Z"/></svg>`;

function catTag(cat, label) { return `<span class="cat-tag" data-cat="${cat}">${label}</span>`; }

function footerHtml(usage, id) {
  return `<div class="card-footer">
    <span class="usage-snippet">${usage}</span>
    <button class="btn-copy" onclick="copyText(event,'${usage.replace(/'/g,"\\'")}'">${COPY_ICON} Copy</button>
    <button class="btn-expand" onclick="toggleCard('${id}')">Details <span class="expand-icon">&#9662;</span></button>
  </div>`;
}

function renderSkillCard(s) {
  const modes = s.modes ? `<div class="expand-row"><div class="expand-label">Modes</div><div class="expand-modes">${s.modes.map(m=>`<div class="mode-item"><span class="mode-label">${m.label}</span>${m.desc}</div>`).join('')}</div></div>` : '';
  const next  = s.next  ? `<div class="expand-row"><div class="expand-label">Next step</div><div class="expand-next"><span class="arrow">&#8594;</span> <code>${s.next}</code></div></div>` : '';
  const detail= s.detail? `<div class="expand-row"><div class="expand-label">Process</div><div class="expand-value">${s.detail}</div></div>` : '';
  return `<div class="card" data-type="skill" data-id="${s.id}" data-cat="${s.cat}" data-tags="${s.tags.join(' ')}" data-name="${s.name}" data-desc="${s.desc}">
    <div class="card-type-bar"></div>
    <div class="card-main" onclick="toggleCard('${s.id}')">
      <div class="card-top"><div class="card-name">${s.name}${s.isNew?'<span class="new-badge">new</span>':''}</div>${catTag(s.cat,s.catLabel)}</div>
      <div class="card-desc">${s.desc}</div>
    </div>
    ${footerHtml(s.usage, s.id)}
    <div class="card-expand">
      <div class="expand-row"><div class="expand-label">Input</div><div class="expand-value">${s.input}</div></div>
      <div class="expand-row"><div class="expand-label">Output</div><div class="expand-value"><code>${s.output}</code></div></div>
      ${detail}${modes}${next}
    </div>
  </div>`;
}

function renderCliCard(c) {
  const prereq = c.prereq ? `<div class="expand-row"><div class="expand-label">Prerequisite</div><div class="prereq-badge">${c.prereq}</div></div>` : '';
  const detail  = c.detail ? `<div class="expand-row"><div class="expand-label">Details</div><div class="expand-value">${c.detail}</div></div>` : '';
  return `<div class="card" data-type="cli" data-id="${c.id}" data-cat="${c.group}" data-tags="${c.tags.join(' ')}" data-name="${c.name}" data-desc="${c.desc}">
    <div class="card-type-bar"></div>
    <div class="card-main" onclick="toggleCard('${c.id}')">
      <div class="card-top"><div class="card-name">${c.name}</div>${catTag(c.group,c.groupLabel)}</div>
      <div class="card-desc">${c.desc}</div>
    </div>
    ${footerHtml(c.usage, c.id)}
    <div class="card-expand">${detail}${prereq}</div>
  </div>`;
}

function renderTemplateCard(t) {
  const files = t.files.map(f=>`<span class="file-pill">${f}</span>`).join('');
  const steps = t.steps.map((s,i)=>`<div class="step-item"><span class="step-num">${i+1}</span><span class="step-cmd">${s}</span></div>`).join('');
  const skill  = t.skill ? `<div class="expand-row"><div class="expand-label">Recommended skill</div><div class="expand-next"><span class="arrow">&#8594;</span> <code>${t.skill}</code></div></div>` : '';
  const detail = t.detail? `<div class="expand-row"><div class="expand-label">Includes</div><div class="expand-value">${t.detail}</div></div>` : '';
  return `<div class="card" data-type="template" data-id="${t.id}" data-cat="${t.cat}" data-tags="${t.tags.join(' ')}" data-name="${t.name}" data-desc="${t.desc}">
    <div class="card-type-bar"></div>
    <div class="card-main" onclick="toggleCard('${t.id}')">
      <div class="card-top"><div class="card-name">${t.name}</div>${catTag(t.cat,t.catLabel)}</div>
      <div class="card-desc">${t.desc}</div>
    </div>
    ${footerHtml(t.usage, t.id)}
    <div class="card-expand">
      <div class="expand-row"><div class="expand-label">Stack</div><div class="expand-value">${t.stack}</div></div>
      <div class="expand-row"><div class="expand-label">Key files</div><div class="file-list">${files}</div></div>
      <div class="expand-row"><div class="expand-label">First steps</div><div class="steps-list">${steps}</div></div>
      ${detail}${skill}
    </div>
  </div>`;
}

function renderAgentCard(a) {
  const skillsList = a.skills.map(s=>`<code>${s}</code>`).join(' ');
  return `<div class="card" data-type="agent" data-id="${a.id}" data-cat="agent" data-tags="${a.tags.join(' ')}" data-name="${a.name}" data-desc="${a.desc}">
    <div class="card-type-bar"></div>
    <div class="card-main" onclick="toggleCard('${a.id}')">
      <div class="card-top"><div class="card-name">${a.name}</div><span class="cat-tag" data-cat="agent">${a.role}</span></div>
      <div class="card-desc">${a.desc}</div>
    </div>
    ${footerHtml(a.usage, a.id)}
    <div class="card-expand">
      <div class="expand-row"><div class="expand-label">Skills</div><div class="expand-value">${skillsList}</div></div>
      <div class="expand-row"><div class="expand-label">Process</div><div class="expand-value">${a.detail}</div></div>
    </div>
  </div>`;
}

/* ─── Filter ── */
function matches(item) {
  const q = searchQuery.toLowerCase();
  if (q) {
    const hay = [item.name, item.desc, ...(item.tags||[])].join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (activeTab === 'skill'    && item.type !== 'skill')    return false;
  if (activeTab === 'cli'      && item.type !== 'cli')      return false;
  if (activeTab === 'template' && item.type !== 'template') return false;
  if (activeTab === 'agent'    && item.type !== 'agent')    return false;
  if (activeCategory !== 'all') {
    const itemCat = item.cat || item.group;
    if (itemCat !== activeCategory) return false;
  }
  return true;
}

function render() {
  const fs = SKILLS.filter(matches);
  const fc = CLI.filter(matches);
  const ft = TEMPLATES.filter(matches);
  const fa = AGENTS.filter(matches);

  document.getElementById('gridSkills').innerHTML    = fs.map(renderSkillCard).join('');
  document.getElementById('gridCli').innerHTML       = fc.map(renderCliCard).join('');
  document.getElementById('gridTemplates').innerHTML = ft.map(renderTemplateCard).join('');
  document.getElementById('gridAgents').innerHTML    = fa.map(renderAgentCard).join('');

  const showSkills = activeTab !== 'cli' && activeTab !== 'template' && activeTab !== 'agent';
  const showCli    = activeTab !== 'skill' && activeTab !== 'template' && activeTab !== 'agent';
  const showTmpl   = activeTab !== 'skill' && activeTab !== 'cli' && activeTab !== 'agent';
  const showAgents = activeTab !== 'skill' && activeTab !== 'cli' && activeTab !== 'template';

  document.getElementById('sectionSkills').style.display    = showSkills  ? '' : 'none';
  document.getElementById('sectionCli').style.display       = showCli     ? '' : 'none';
  document.getElementById('sectionTemplates').style.display = showTmpl    ? '' : 'none';
  document.getElementById('sectionAgents').style.display    = showAgents  ? '' : 'none';

  document.getElementById('emptySkills').classList.toggle('visible',    showSkills  && fs.length === 0);
  document.getElementById('emptyCli').classList.toggle('visible',       showCli     && fc.length === 0);
  document.getElementById('emptyTemplates').classList.toggle('visible', showTmpl    && ft.length === 0);
  document.getElementById('emptyAgents').classList.toggle('visible',    showAgents  && fa.length === 0);

  document.getElementById('skillCount').textContent     = fs.length + ' skills';
  document.getElementById('cliCount').textContent       = fc.length + ' commands';
  document.getElementById('templateCount').textContent  = ft.length + ' templates';
  document.getElementById('agentCount').textContent     = fa.length + ' agents';
  document.getElementById('countAll').textContent       = fs.length + fc.length + ft.length + fa.length;
  document.getElementById('countSkills').textContent    = fs.length;
  document.getElementById('countCli').textContent       = fc.length;
  document.getElementById('countTemplates').textContent = ft.length;
  document.getElementById('countAgents').textContent    = fa.length;
}

function renderChips() {
  let chips = SKILL_CHIPS;
  if (activeTab === 'cli')      chips = CLI_CHIPS;
  if (activeTab === 'template') chips = TEMPLATE_CHIPS;
  if (activeTab === 'agent')    chips = AGENT_CHIPS;
  document.getElementById('chipGroup').innerHTML = chips.map(c =>
    `<button class="chip${activeCategory===c.cat?' active':''}" data-cat="${c.cat}" onclick="setCategory('${c.cat}')">${c.label}</button>`
  ).join('');
}

function setTab(tab) {
  activeTab = tab; activeCategory = 'all';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  renderChips(); render();
}

function setCategory(cat) { activeCategory = cat; renderChips(); render(); }

function toggleCard(id) {
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (card) card.classList.toggle('expanded');
}

function copyText(e, text) {
  e.stopPropagation();
  navigator.clipboard.writeText(text).then(() => {
    const btn = e.currentTarget, prev = btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 15 15" fill="currentColor"><path d="M11.467 3.727c.289.189.37.576.181.865l-4.5 6.75a.637.637 0 0 1-.966.096L3.182 8.438a.625.625 0 1 1 .884-.884l2.6 2.6 4.051-6.077a.625.625 0 0 1 .75-.35Z"/></svg> Copied`;
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = prev; }, 1500);
  });
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim(); activeCategory = 'all'; renderChips(); render();
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== document.getElementById('searchInput')) { e.preventDefault(); document.getElementById('searchInput').focus(); }
  if (e.key === 'Escape') document.getElementById('searchInput').blur();
});
document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => setTab(btn.dataset.tab)));

const root = document.documentElement;
const SUN  = `<path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z"/>`;
const MOON = `<path d="M6 .278a.77.77 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/>`;

let isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme() { root.setAttribute('data-theme', isDark?'dark':'light'); document.getElementById('themeIcon').innerHTML = isDark?MOON:SUN; }
document.getElementById('themeBtn').addEventListener('click', () => { isDark=!isDark; applyTheme(); });
applyTheme();
renderChips();
render();
</script>

</body>
</html>
