<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rbb · Engineering Catalog</title>
  <style>
    :root {
      --bg:            #0d1117;
      --surface:       #161b22;
      --surface-hover: #1c2128;
      --border:        #21262d;
      --border-focus:  #3b82f6;
      --text:          #e6edf3;
      --text-muted:    #7d8590;
      --text-dim:      #484f58;
      --accent-skill:  #3b82f6;
      --accent-cli:    #f59e0b;
      --accent-tmpl:   #8b5cf6;
      --accent-agent:  #10b981;
      --tag-discovery: #60a5fa;
      --tag-planning:  #a78bfa;
      --tag-dev:       #34d399;
      --tag-review:    #fb923c;
      --tag-debug:     #f87171;
      --tag-delivery:  #2dd4bf;
      --tag-init:      #60a5fa;
      --tag-sync:      #a78bfa;
      --tag-boards:    #34d399;
      --tag-utils:     #94a3b8;
      --tag-tbackend:  #34d399;
      --tag-tfrontend: #38bdf8;
      --tag-tfullstack:#a78bfa;
      --tag-tdevops:   #f97316;
      --code-bg:       #1c2128;
      --glow:          rgba(59,130,246,.12);
      --radius:        8px;
      --radius-sm:     5px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg:#f6f8fa;--surface:#ffffff;--surface-hover:#f0f3f7;
        --border:#d0d7de;--text:#1f2328;--text-muted:#636c76;
        --text-dim:#9198a1;--glow:rgba(59,130,246,.08);--code-bg:#eaedf1;
      }
    }
    :root[data-theme="dark"] {
      --bg:#0d1117;--surface:#161b22;--surface-hover:#1c2128;
      --border:#21262d;--text:#e6edf3;--text-muted:#7d8590;
      --text-dim:#484f58;--glow:rgba(59,130,246,.12);--code-bg:#1c2128;
    }
    :root[data-theme="light"] {
      --bg:#f6f8fa;--surface:#ffffff;--surface-hover:#f0f3f7;
      --border:#d0d7de;--text:#1f2328;--text-muted:#636c76;
      --text-dim:#9198a1;--glow:rgba(59,130,246,.08);--code-bg:#eaedf1;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 14px; line-height: 1.6; min-height: 100vh;
    }
    code, .mono { font-family: 'SF Mono','Fira Code','Cascadia Code','Consolas','Liberation Mono',monospace; font-size: .85em; }
    button { cursor: pointer; border: none; background: none; color: inherit; font: inherit; }
    button:focus-visible { outline: 2px solid var(--accent-skill); outline-offset: 2px; }

    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 56px;
      backdrop-filter: blur(8px);
    }
    .logo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; text-decoration: none; }
    .logo-badge {
      font-family: 'SF Mono','Fira Code','Cascadia Code',monospace;
      font-size: 12px; font-weight: 600; letter-spacing: -.3px;
      background: var(--accent-skill); color: #fff; padding: 3px 7px; border-radius: 4px;
    }
    .logo-label { font-size: 13px; font-weight: 500; color: var(--text-muted); letter-spacing: .01em; }
    .search-wrap { flex: 1; max-width: 560px; margin: 0 auto; position: relative; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); pointer-events: none; }
    .search-input {
      width: 100%; height: 36px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); padding: 0 40px 0 36px; font-size: 13.5px;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-input::placeholder { color: var(--text-dim); }
    .search-input:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--glow); }
    .search-kbd {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      font-family: monospace; font-size: 10px; color: var(--text-dim);
      background: var(--border); border-radius: 3px; padding: 1px 5px; pointer-events: none;
    }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .theme-btn {
      width: 32px; height: 32px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); transition: background .15s, color .15s;
    }
    .theme-btn:hover { background: var(--surface); color: var(--text); }

    .filter-bar {
      padding: 12px 24px 0; border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .tab-group { display: flex; gap: 2px; }
    .tab-btn {
      padding: 6px 14px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500; color: var(--text-muted);
      transition: background .12s, color .12s; position: relative;
    }
    .tab-btn:hover { background: var(--surface); color: var(--text); }
    .tab-btn.active { color: var(--text); background: var(--surface); }
    .tab-btn.active::after {
      content: ''; position: absolute; bottom: -13px; left: 0; right: 0; height: 2px;
      background: var(--accent-skill); border-radius: 2px 2px 0 0;
    }
    .tab-count {
      font-size: 11px; color: var(--text-dim); background: var(--border);
      border-radius: 10px; padding: 1px 6px; margin-left: 4px;
    }
    .chip-group { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 10px; }
    .chip {
      padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500;
      border: 1px solid var(--border); color: var(--text-muted);
      transition: all .12s; background: transparent;
    }
    .chip:hover { border-color: var(--text-dim); color: var(--text); }
    .chip.active { color: #fff; border-color: transparent; }
    .chip[data-cat="all"].active       { background: var(--accent-skill); }
    .chip[data-cat="discovery"].active { background: var(--tag-discovery); }
    .chip[data-cat="planning"].active  { background: var(--tag-planning); }
    .chip[data-cat="dev"].active       { background: var(--tag-dev); }
    .chip[data-cat="review"].active    { background: var(--tag-review); }
    .chip[data-cat="debug"].active     { background: var(--tag-debug); }
    .chip[data-cat="delivery"].active  { background: var(--tag-delivery); }
    .chip[data-cat="init"].active      { background: var(--tag-init); }
    .chip[data-cat="sync"].active      { background: var(--tag-sync); }
    .chip[data-cat="boards"].active    { background: var(--tag-boards); }
    .chip[data-cat="utils"].active     { background: var(--tag-utils); }
    .chip[data-cat="tbackend"].active  { background: var(--tag-tbackend); }
    .chip[data-cat="tfrontend"].active { background: var(--tag-tfrontend); }
    .chip[data-cat="tfullstack"].active{ background: var(--tag-tfullstack); }
    .chip[data-cat="tdevops"].active   { background: var(--tag-tdevops); }

    .main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .section { margin-bottom: 40px; }
    .section-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
    .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); }
    .section-line { flex: 1; height: 1px; background: var(--border); }
    .section-count { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; transition: border-color .15s; display: flex; flex-direction: column;
    }
    .card:hover { border-color: var(--text-dim); }
    .card.expanded { border-color: var(--text-dim); }
    .card-type-bar { height: 3px; flex-shrink: 0; }
    .card[data-type="skill"]    .card-type-bar { background: var(--accent-skill); }
    .card[data-type="cli"]      .card-type-bar { background: var(--accent-cli); }
    .card[data-type="template"] .card-type-bar { background: var(--accent-tmpl); }
    .card[data-type="agent"]    .card-type-bar { background: var(--accent-agent); }
    .cat-tag[data-cat="agent"]  { background: rgba(16,185,129,.15); color: #10b981; }

    .card-main { padding: 14px 16px 12px; cursor: pointer; flex: 1; }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .card-name {
      font-size: 13.5px; font-weight: 600; letter-spacing: -.01em;
      font-family: 'SF Mono','Fira Code','Cascadia Code',monospace; color: var(--text);
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .card-name .new-badge {
      font-size: 10px; font-weight: 600; font-family: system-ui,sans-serif;
      background: var(--tag-dev); color: #fff; padding: 1px 5px; border-radius: 3px;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .cat-tag { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
    .cat-tag[data-cat="discovery"]  { background: color-mix(in srgb,var(--tag-discovery) 15%,transparent); color:var(--tag-discovery); }
    .cat-tag[data-cat="planning"]   { background: color-mix(in srgb,var(--tag-planning)  15%,transparent); color:var(--tag-planning); }
    .cat-tag[data-cat="dev"]        { background: color-mix(in srgb,var(--tag-dev)       15%,transparent); color:var(--tag-dev); }
    .cat-tag[data-cat="review"]     { background: color-mix(in srgb,var(--tag-review)    15%,transparent); color:var(--tag-review); }
    .cat-tag[data-cat="debug"]      { background: color-mix(in srgb,var(--tag-debug)     15%,transparent); color:var(--tag-debug); }
    .cat-tag[data-cat="delivery"]   { background: color-mix(in srgb,var(--tag-delivery)  15%,transparent); color:var(--tag-delivery); }
    .cat-tag[data-cat="init"]       { background: color-mix(in srgb,var(--tag-init)      15%,transparent); color:var(--tag-init); }
    .cat-tag[data-cat="sync"]       { background: color-mix(in srgb,var(--tag-sync)      15%,transparent); color:var(--tag-sync); }
    .cat-tag[data-cat="boards"]     { background: color-mix(in srgb,var(--tag-boards)    15%,transparent); color:var(--tag-boards); }
    .cat-tag[data-cat="utils"]      { background: color-mix(in srgb,var(--tag-utils)     15%,transparent); color:var(--tag-utils); }
    .cat-tag[data-cat="tbackend"]   { background: color-mix(in srgb,var(--tag-tbackend)  15%,transparent); color:var(--tag-tbackend); }
    .cat-tag[data-cat="tfrontend"]  { background: color-mix(in srgb,var(--tag-tfrontend) 15%,transparent); color:var(--tag-tfrontend); }
    .cat-tag[data-cat="tfullstack"] { background: color-mix(in srgb,var(--tag-tfullstack)15%,transparent); color:var(--tag-tfullstack); }
    .cat-tag[data-cat="tdevops"]    { background: color-mix(in srgb,var(--tag-tdevops)   15%,transparent); color:var(--tag-tdevops); }

    .card-desc { font-size: 13px; color: var(--text-muted); line-height: 1.55; }

    .card-footer {
      padding: 10px 16px; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .usage-snippet {
      font-family: 'SF Mono','Fira Code','Cascadia Code',monospace;
      font-size: 11.5px; color: var(--text-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
    }
    .btn-copy {
      flex-shrink: 0; padding: 3px 8px; border-radius: var(--radius-sm);
      font-size: 11px; color: var(--text-muted); background: var(--code-bg);
      border: 1px solid var(--border); transition: all .12s; display: flex; align-items: center; gap: 4px;
    }
    .btn-copy:hover { color: var(--text); border-color: var(--text-dim); }
    .btn-copy.copied { color: var(--tag-dev); border-color: var(--tag-dev); }
    .btn-expand {
      padding: 3px 8px; border-radius: var(--radius-sm); font-size: 11px; color: var(--text-muted);
      display: flex; align-items: center; gap: 3px; background: transparent; transition: color .12s; flex-shrink: 0;
    }
    .btn-expand:hover { color: var(--text); }
    .expand-icon { transition: transform .2s; display: inline-block; }
    .card.expanded .expand-icon { transform: rotate(180deg); }

    .card-expand {
      display: none; border-top: 1px solid var(--border);
      padding: 14px 16px; flex-direction: column; gap: 10px;
    }
    .card.expanded .card-expand { display: flex; }
    .expand-row { display: flex; flex-direction: column; gap: 3px; }
    .expand-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); }
    .expand-value { font-size: 12.5px; color: var(--text-muted); }
    .expand-value code { background: var(--code-bg); padding: 1px 5px; border-radius: 3px; color: var(--text); }
    .expand-modes { display: flex; flex-direction: column; gap: 4px; }
    .mode-item { font-size: 12px; color: var(--text-muted); display: flex; gap: 6px; }
    .mode-label {
      font-size: 10px; font-weight: 600; background: var(--border); color: var(--text-dim);
      padding: 1px 5px; border-radius: 3px; flex-shrink: 0; align-self: flex-start; margin-top: 2px; font-family: monospace;
    }
    .expand-next {
      font-size: 12px; color: var(--text-muted); background: var(--code-bg);
      border-radius: var(--radius-sm); padding: 8px 10px; display: flex; align-items: center; gap: 6px;
    }
    .expand-next .arrow { color: var(--accent-skill); }
    .expand-next code { color: var(--accent-skill); background: transparent; padding: 0; }
    .prereq-badge { font-size: 11.5px; color: var(--text-muted); background: var(--code-bg); border-radius: var(--radius-sm); padding: 6px 10px; font-family: monospace; }

    .file-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .file-pill {
      font-family: 'SF Mono','Fira Code','Cascadia Code',monospace;
      font-size: 10.5px; color: var(--text-dim); background: var(--code-bg);
      border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px;
    }
    .steps-list { display: flex; flex-direction: column; gap: 4px; }
    .step-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
    .step-num { font-size: 10px; color: var(--text-dim); background: var(--border); border-radius: 50%; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 600; }
    .step-cmd { font-family: monospace; font-size: 11.5px; color: var(--text); background: var(--code-bg); padding: 2px 6px; border-radius: 3px; }

    .empty { text-align: center; padding: 48px 24px; color: var(--text-dim); font-size: 14px; display: none; }
    .empty.visible { display: block; }
    .empty-icon { font-size: 32px; margin-bottom: 8px; }

    @media (max-width: 600px) {
      .header { padding: 0 16px; gap: 10px; }
      .logo-label { display: none; }
      .search-kbd { display: none; }
      .main { padding: 16px; }
      .card-grid { grid-template-columns: 1fr; }
      .filter-bar { padding: 10px 16px 0; }
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header class="header">
  <a class="logo" href="#">
    <span class="logo-badge">rbb</span>
    <span class="logo-label">engineering catalog</span>
  </a>
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
      <path d="M10 6.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Zm-.82 3.68a4.5 4.5 0 1 1 .71-.71l2.97 2.96-.71.71-2.97-2.96Z" fill="currentColor"/>
    </svg>
    <input class="search-input" id="searchInput" type="search" placeholder="Search skills, commands, templates, agents…" autocomplete="off" spellcheck="false">
    <span class="search-kbd">/</span>
  </div>
  <div class="header-actions">
    <button class="theme-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M6 .278a.77.77 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/>
      </svg>
    </button>
  </div>
</header>

<div class="filter-bar" id="filterBar">
  <div class="tab-group">
    <button class="tab-btn active" data-tab="all">All <span class="tab-count" id="countAll">0</span></button>
    <button class="tab-btn" data-tab="skill">Skills <span class="tab-count" id="countSkills">0</span></button>
    <button class="tab-btn" data-tab="cli">CLI <span class="tab-count" id="countCli">0</span></button>
    <button class="tab-btn" data-tab="template">Templates <span class="tab-count" id="countTemplates">0</span></button>
    <button class="tab-btn" data-tab="agent">Agents <span class="tab-count" id="countAgents">0</span></button>
  </div>
  <div class="chip-group" id="chipGroup"></div>
</div>

<main class="main">
  <div class="section" id="sectionSkills">
    <div class="section-header">
      <span class="section-title">AI Skills</span>
      <div class="section-line"></div>
      <span class="section-count" id="skillCount">0</span>
    </div>
    <div class="card-grid" id="gridSkills"></div>
    <div class="empty" id="emptySkills"><div class="empty-icon">&#9678;</div>No skills found.</div>
  </div>

  <div class="section" id="sectionCli">
    <div class="section-header">
      <span class="section-title">CLI Commands</span>
      <div class="section-line"></div>
      <span class="section-count" id="cliCount">0</span>
    </div>
    <div class="card-grid" id="gridCli"></div>
    <div class="empty" id="emptyCli"><div class="empty-icon">&#9678;</div>No commands found.</div>
  </div>

  <div class="section" id="sectionTemplates">
    <div class="section-header">
      <span class="section-title">Project Templates</span>
      <div class="section-line"></div>
      <span class="section-count" id="templateCount">0</span>
    </div>
    <div class="card-grid" id="gridTemplates"></div>
    <div class="empty" id="emptyTemplates"><div class="empty-icon">&#9678;</div>No templates found.</div>
  </div>

  <div class="section" id="sectionAgents">
    <div class="section-header">
      <span class="section-title">AI Agents</span>
      <div class="section-line"></div>
      <span class="section-count" id="agentCount">0</span>
    </div>
    <div class="card-grid" id="gridAgents"></div>
    <div class="empty" id="emptyAgents"><div class="empty-icon">&#9678;</div>No agents found.</div>
  </div>
</main>

<script>
const SKILLS = [
  { id:'project-discovery',  type:'skill', name:'project-discovery',  isNew:false, cat:'discovery', catLabel:'Discovery',
    desc:'Transforma um briefing de negócio em visão de produto estruturada, com MVP definido, backlog priorizado e roadmap em fases.',
    detail:'9 steps: business context analysis, pain point mapping, process review, product definition, MVP, initial backlog, risks, roadmap, and executive summary in business language.',
    input:'Stakeholder or client context (free text)', output:'docs/project-discovery/project_discovery_YYYYMMDD.NN.md',
    usage:'@.claude/commands/project-discovery.md', modes:null, next:'backlog-breakdown',
    tags:['discovery','product','mvp','backlog','personas'] },
  { id:'backlog-breakdown',  type:'skill', name:'backlog-breakdown',  isNew:true, cat:'discovery', catLabel:'Discovery',
    desc:'Decompõe um discovery, uma análise de codebase ou um épico do board em backlog estruturado de Épicos e Features, com DoR, DoD, jornadas do ator e escopo por camada.',
    detail:'Generates Epics → Features only (US/TE/TD are handled by the planning skill per feature). Each Feature includes: technical layer (Backend Domain/Application/Infra/API, Frontend, Fullstack, Infra/DevOps), actor journey mapping from discovery personas, DoR (concrete pre-conditions), DoD (specific testable criteria + how to test + explicit scope negation). MoSCoW prioritization, relative estimation (XS–XL), DDD-aware ordering within epics. Three modes: from discovery, from codebase, or from Azure Boards epic. Closed scope (#953): the base scope is the literal request; a related ToDo, an answer to a discovery question or an agent suggestion goes to Opcionais (fora do escopo base) with origin and cost, and only enters when the dev picks it. Tabela Sumario, Mapa de Dependencias and Opcionais are level-2 sections that rbb skill verify checks.',
    input:'Project discovery document, new module description, or Azure Boards epic ID', output:'docs/backlog/backlog_YYYYMMDD.NN.md + Epic/Feature cards in Azure Boards',
    usage:'@.claude/commands/backlog-breakdown.md',
    modes:[{label:'Mode A',desc:'From a discovery in docs/project-discovery/'},{label:'Mode B',desc:'From existing codebase analysis'},{label:'Mode C',desc:'From a specific Azure Boards epic ID'}],
    next:'planning', tags:['backlog','epics','features','MoSCoW','azure boards','ddd'] },
  { id:'codebase-map',       type:'skill', name:'codebase-map',       isNew:true,  cat:'discovery', catLabel:'Discovery',
    desc:'Gera e mantém o mapa de navegação do código: módulos, pontos de entrada, fluxos principais e onde mexer para cada mudança. Atualiza pelo diff e confere no disco todo caminho citado.',
    detail:'7 steps: starting point (HEAD, clean tree in scope, previous map), modules from the profile layers, stack boundaries or folders, classified by git diff as reanalysed, new, removed or inherited, a mapping plan the dev approves, one sheet per module (in parallel with subagents when available), synthesis of entry points, main flows file by file and where to change for common changes, write the map and check that every cited path exists, archive the previous map. Navigation, not assessment: no score, no debt, no stack copied from the profile, nothing copied into CLAUDE.md beyond a one-line pointer. Inspired by the Cartographer plugin.',

  { id:'planning',           type:'skill', name:'planning',           isNew:true,  cat:'planning', catLabel:'Planning',

  { id:'refinement',         type:'skill', name:'refinement',         isNew:false, cat:'planning', catLabel:'Planning',
    desc:'Transforma um card num plano técnico suficiente para implementar: solução nativa primeiro, arquivos com âncora, Tasks por necessidade com um agente e as camadas declaradas, critérios com o teste de cada um, até três perguntas e um teto de palavras pelo porte.',
    detail:'Steps: understanding, the minimal or native solution, files with anchor and contract, tasks by need (max 1 day each; in P the card is the unit), one test per acceptance criterion, and risks only when there are any. Every Task has ONE agent, written to the batch as agente and to the board as the tag agente:<name>, which is what the orchestrator dispatches by; rbb boards batch refuses a Task with more than one owner (#733). A Task exists only when the work has another owner and each part ends with a green build; in P the card is the unit and carries the tags itself. Work that crosses layers stays with one owner and declares the layers (camada:<x>). Whoever implements writes one test per acceptance criterion plus the regression, in the same Task; there is no tests-only Task and no coverage target (#956). Each Task, or the card in P, carries complexidade:baixa|media|alta next to agente:, which flow dispatch uses to pick the model (#957). Explicit requirements from the request (color, text, visual reference) go literally into the criteria of the Task that implements them, because a color that never reached the Task only surfaced in homologation (#731). In mode azure the document is named after the card, refinement_737.01.md, so the file the chat asks to approve is the one found by the card number; it is analysis with no Status, and a document born before its card is renamed when the card is created (#745). Since #954 the document is enough to implement and nothing more: a Porte header (P, M or G, from the flow or from shared/contracts/porte.md) and nine sections, from Objetivo and Solucao minima / nativa considerada to Decidido (vete se discordar) and at most three Perguntas ao dev. The native solution of the framework comes before any own type; each acceptance criterion carries the test that proves it, with no per-class test table; batch JSON, board commands and the approval addendum stay out of the document. rbb skill verify enforces the word cap per size (600, 1200, 2500), and an approval in the flow is refused for a non conforming document. The DelegatingHandler skeleton moved to AP-001, and the synced command went from 1314 to 1000 lines, the ceiling of the E2E gate. On the board, each Task of the batch carries agente, camadas and complexidade; in P (Mode 1) there is no batch, and the tags go to the card itself with boards update --add-tags (#960).',
    input:'Azure Boards card ID (#XXXXX) or textual feature description', output:'docs/refinement/refinement_<card>.NN.md in mode azure, refinement_YYYYMMDD.NN.md in mode local + Tasks in Azure Boards',
    usage:'@.claude/commands/refinement.md #1234',
    modes:[{label:'Mode 1',desc:'From an existing Azure Boards card (#XXXXX)'},{label:'Mode 2',desc:'Free context: Bug, User Story, Feature, Technical Enabler, or Technical Debt'}],
    next:'implementation', tags:['refinement','tasks','tests','estimates','azure boards'] },
  { id:'implementation',     type:'skill', name:'implementation',     isNew:false, cat:'dev', catLabel:'Development',

  { id:'cicd',               type:'skill', name:'cicd',               isNew:false, cat:'delivery', catLabel:'Delivery',
    desc:'Cria ou revisa pipelines de CI/CD para qualquer provedor. Conduz um questionário estruturado antes de gerar qualquer YAML.',
    detail:'The CI platform is DERIVED from `git remote get-url origin`, not asked — dev.azure.com means Azure Pipelines, github.com means Actions, and only an absent or unknown remote triggers a question. Asking what the disk already answers is AP-008. When a migration is under way the target is the DESTINATION, not the current remote: generating Actions for a repo that moves tomorrow is work thrown away. Phase 0: 8-group questionnaire — stack, where the code and the pipeline live, deploy target (and whether the app must stay up), secrets, where the images live, quality gates, versioning, and a free-form field for edge cases. Phase 1: consolidates a DevOps Profile for confirmation. Phase 2: analyzes existing pipelines. Phase 3: generates provider-specific CI and CD pipelines. Phase 4: Dockerfile if needed. Phase 5: full variable documentation. It conducts the container registry choice instead of just asking which one: the answer decides who publishes, who pulls, with which token and what happens to old images, and each registry asks only its own follow-ups. For GHCR it derives the owner from the git remote, separates the publish token from the pull token — GitHub Actions\' built-in token expires at the end of the run and must never be the credential Azure pulls with —, and generates retention that protects the images production is RUNNING before deleting anything, because age-only retention deletes the good image the day three deploys in a row fail. When the deploy target scales to zero, it is the SPECIALIST on business-hours windows: the developer says "8 to 6, weekdays" and the skill derives the cron expressions, never asking him for them, then reads the schedule back in plain language before generating anything — cron is easy to misread and the mistake only shows up the next morning. It ASKS whether the application must stay up: always on, a business-hours window, or always on demand — it never assumes the window saves money, because a queue consumer that sleeps loses messages and a third-party webhook does not retry. If a window is chosen it generates TWO scale rules, not one: declaring any custom rule removes Container Apps implicit HTTP rule, so without redeclaring it min-replicas 0 means an app that sleeps and cannot be woken. The second rule is applied by reading the template and reapplying it, never by a second --scale-rule call, because that parameter REPLACES the whole scale. On Azure Pipelines the generated pipeline no longer uses @templates, which needs read access to the templates repository: it runs rbb sync pipeline first and references the versioned copy under /azure-pipelines/guild/, with the feed URL taken from cliRegistry and an optional feedServiceConnection for a feed in another organization (#971).rules array instead of merging by name — confirmed in production, where it erased the cron rule applied one line above and the symptom only appeared days later.',
    input:'Existing project (the skill reads the codebase to detect the current state)', output:'docs/cicd/cicd_YYYYMMDD.NN.md + pipeline config files',
    usage:'@.claude/commands/cicd.md', modes:null, next:null, tags:['ci/cd','devops','deploy','pipeline','github actions','azure pipelines','jenkins'] },

  { id:'troubleshoot',       type:'skill', name:'troubleshoot',       isNew:true,  cat:'debug', catLabel:'Debug',
    desc:'Investiga problema em produção pela telemetria: levanta a observabilidade do repositório, varre a cloud em modo somente leitura, decompõe onde o tempo ou o erro acontece e liga o número ao código.',

    detail:'Inventaria todas as subpastas de docs/ (todos, refinement, backlog, prioritization, project-discovery, implementation-notes e outras), identifica documentos com status concluído/substituído ainda ativos, apresenta diagnóstico completo e executa arquivamento apenas após confirmação. Garante que prioritization tenha sempre no máximo 1 arquivo ativo, com a cadeia de histórico preservada em archived/. In mode azure it suggests renaming active card documents that still carry the date (never archived, superseded or about-to-be-archived ones, which nobody looks up anymore) to the card key (refinement_20260928.03.md to refinement_737.01.md), read from the Card header field; a header with several cards suggests the first and flags it, a header with none gets no suggestion, and the developer can approve one file at a time (#745).',

  { id:'orchestrator',   type:'skill', name:'orchestrator',   isNew:true,  cat:'planning', catLabel:'Planning',
    desc:'Conduz uma demanda ou um bug de ponta a ponta, um agente por etapa: o dev aprova escopo, plano e resultado final, e a execução de um plano aprovado segue sem pergunta por card até o code-review.',
    detail:'Three routing incidents came from an agent deciding scope in the middle of execution: four agents refusing the same card in a loop, a batch dropped because of one card from another scope, and a card left without owner by a routing tie. The orchestrator takes that decision away from whoever executes. It runs in the main session and is not an agent, because approval only counts when it comes from the developer and an agent message is never treated as user approval. It never writes outside .rbb/ while a flow is active, and a hook enforces that; a subagent trying to dispatch another agent is blocked too. Between agents only what is on disk passes, since a subagent context dies when it returns. Each step is recorded in .rbb/fluxo.json when it happens, an approved step is never redone, a refusal is redispatched to whoever was named but never to someone who already refused, and a return for missing input does not count as refusal. On the third refusal of the same card the flow stops and only an explicit decision of the developer moves it. Autonomy per transition is proposed by the data, after five consecutive approvals without change, and confirmed by the developer; an autonomous pass is not recorded as an approval, so autonomy cannot feed itself. The model of each dispatch follows an observable rule, never above opus automatically, and an explicit request from the developer always wins. Three changes came from one real session (US #718): with the refinement approved, the eight Tasks asked for eight approvals and none changed scope, so an approved plan now covers implementation, code-review and adjustments of every card under it, and the flow only stops on refusal, return, scope change, failing verification or a guard block, with simple deviations collected into one final report (#730). The flow no longer ends at implementation: the qa runs code-review on each refined card and every finding goes straight to the layer owner as an adjustment (#732). A divergence found in homologation before delivery is the same work not yet accepted, not a bug, so the flow is reopened and the same agent gets the same Task as an adjustment (#731). Before the flow, a demand is sized (#951): the orchestrator reads what the request touches, writes a minimal proposal in .rbb/proposta.md (literal items, minimal native solution, acceptance criteria from the request with one per new behavior, files and lines estimate, optional extras with cost, size P, M or G as in shared/contracts/porte.md; in P and M, flow start refuses a proposal without acceptance criteria and the po transcribes them into the card, #962) and the developer approves it; rbb flow start records the size and the proposal as step 1. P and M skip backlog-breakdown and planning and close with one code-review. Review findings are triaged (#952): Blocker is dispatched as --ajuste --severidade blocker, the Warnings go to the developer in a single multi-select question, and what is not chosen, plus what agents return as out of scope, is parked with record --estacionado and listed in the final report. Publishing an approved plan is dispatch --executa, which is what lets boards batch create the Tasks inside the flow; in P and M the po publishes the proposal without --skill (dispatch --agente po --executa 1). In a bug flow without a card, the po creates it in a step that executes the approved triage, step 1, since boards create refuses a card outside an approved proposal (#960). The model and effort of each dispatch come from the CLI rule that dispatch prints, not from a table in the prompt (#957); the dispatch goes without --modelo, so the step records the model of the rule, and --modelo with --origem dev only when the developer asks (#960).',
    input:'Um pedido livre do dev: uma demanda a construir ou um bug relatado',
    output:'.rbb/fluxo.json e os eventos de despacho, aprovação, recusa e devolução em .rbb/events.jsonl. Os documentos são dos agentes despachados',
    usage:'@.claude/commands/orchestrator.md <pedido>', modes:[{label:'demanda', desc:'proposta mínima com porte P, M ou G aprovada antes do fluxo; em P e M o po cria os cards da proposta e segue para refinement, implementação e um code-review; em G, po, tech-lead, implementação por card, code-review do qa, ajustes, relatório único'},{label:'bug', desc:'qa com bug-triage, depois bugfix direto ou via refinamento do tech-lead, e code-review da correção'}], next:null, tags:['orquestrador','fluxo','aprovacao','roteamento'] },
  { id:'guild-help',     type:'skill', name:'guild-help',     isNew:true,  cat:'discovery', catLabel:'Discovery',
    desc:'Explica o que a plataforma é, o que existe neste repositório e qual é o próximo passo, derivando tudo do disco em vez de uma lista escrita à mão.',
    detail:'A skill de leitura que faltava: quem recebia o Guild num projeto novo descobria por tentativa, procurava uma skill de instalacao e encontrava project-discovery, codebase-analysis ou board-adoption, todas sobre conteudo e nenhuma sobre comecar. O que define esta skill nao e o que ela diz, e de onde ela tira: tudo vem de `rbb guild --json`, executado na hora, que deriva as skills das pastas, os agentes do frontmatter, os comandos do proprio CLI e o estado da adocao dos arquivos no disco. Ela nao pode listar de memoria, e a regra tem historia: tres listas escritas a mao neste repositorio ficaram para tras sem dar erro nenhum, o README anunciava 19 skills quando havia 26, o indice do shared/ cobria 8 de 20 blocos, e o catalogo passou meses sem quatro comandos que existiam. Lista a mao nao avisa que envelheceu, so devolve menos. Quando a pergunta e qual skill serve para o meu caso, ela le a tabela canonica de roteamento e aplica a precedencia que ja custou um card sem dono: a atividade vence o tema. Ao indicar uma skill diz por que ela e nao a vizinha, porque a confusao quase sempre e entre duas e nomear so a vencedora nao ensina a escolher da proxima vez. Se nenhuma serve, admite a lacuna em vez de empurrar a mais parecida. E nao escreve arquivo nenhum: indica o comando e para, porque skill de leitura que comeca a escrever e o tipo de responsabilidade difusa que a plataforma existe para evitar.',
    input:'Nenhuma entrada obrigatoria. Uma pergunta livre recorta a resposta entre visao geral, primeiros passos e roteamento',
    output:'A propria resposta na sessao. Nao gera documento, porque seria uma copia do que o rbb guild deriva em milissegundos',
    usage:'@.claude/commands/guild-help.md', modes:[{label:'o que e isso', desc:'Visao geral, inventario e proximo passo'},{label:'como comeco', desc:'So a sequencia de adocao, a partir do primeiro passo pendente'},{label:'qual skill para X', desc:'Roteamento, com o porque da escolha contra a vizinha'}], next:'guild-init', tags:['onboarding','orientacao','roteamento','catalogo'] },
  { id:'guild-init',     type:'skill', name:'guild-init',     isNew:true,  cat:'delivery', catLabel:'Delivery',
    desc:'Instala e configura o Guild num repositório existente: modo de trabalho, conexão com o board, time de agentes e, sobretudo, os hooks da guarda de escrita.',
    detail:'The failure this skill exists to prevent is not misconfiguration — it is stopping halfway while the developer believes it finished. A repository with skills synced and NO hooks looks adopted and is not: it has the instructions and no mechanism, which this platform has already proven insufficient three times. So the skill does not end at "configured", it ends at a green `rbb doctor`, and it confirms hooks as STATE rather than trusting that the command ran. It reads the disk before asking anything: organization and project come from the git remote, mode and state mapping from .rbb/boards.json, layers from .rbb/project.yaml — asking what is already recorded trains the developer to answer on autopilot and leaves two competing truths. Before the sync it completes the platform config: the manual rbb configure that made the skill exist usually leaves something behind (only the monorepo and no feed, a legacy URL, or a machine-global config that never reached the repository), so it reads rbb configure --show, asks in chat and writes through the CLI flags, never editing .rbb/config.json by hand (the same canonical step as guild-upgrade). The PAT value is never typed, pasted or echoed; only the NAME of the environment variable is stored. Running twice cannot break anything, because adoption is resumed often. Work still open in docs/ is declared as pending for `board-adoption` instead of being left for the developer to discover weeks later with control already duplicated. It closes pointing to rbb catalog, the catalog of the installed version, so the team finds the rest of the Guild without depending on whoever adopted it (#967).',
    input:'An existing repository (no arguments — state is read from disk)', output:'.rbb/config.json completed, .rbb/ configured, agents derived, hooks installed, rbb doctor green',
    usage:'@.claude/commands/guild-init.md', modes:[{label:'azure', desc:'Board connection configured and verified with rbb boards test'},{label:'local', desc:'Markdown in docs/ stays the source of truth; stops after derive and doctor'}], next:'board-adoption', tags:['setup','adoption','hooks','onboarding'] },
  { id:'guild-upgrade',  type:'skill', name:'guild-upgrade',  isNew:true,  cat:'delivery', catLabel:'Delivery',
    desc:'Atualiza o Guild num repositório já adotado, de ponta a ponta, e pergunta no chat o que ainda não está parametrizado em vez de deixar o comando falhar.',
    detail:'Upgrading the platform used to be a sequence the developer had to know by heart: rbb update, rbb configure, rbb sync all, rbb profile refresh, rbb agents derive, rbb doctor. A missing parameter (the npm feed, a repository URL) only surfaced as an error, and the configure command that would fix it was interactive, so an AI session (whose shell has no stdin) could not run it. The skill reads `rbb version` and `rbb configure --show` (JSON with what is set, what is missing and which legacy repositories still point outside the Guild monorepo), presents a plan, asks every missing item in a single chat message and writes the answers through `rbb configure --<flag>`, which validates them (a feed that is not https is refused and nothing is written). Only then it runs update, sync, profile refresh and agents derive, in that order, so hooks are reinstalled by the version that just arrived, and finishes on a green doctor or declares itself pending. A dev CLI (0.0.0-dev, npm link) is never updated from the feed. A repository that never adopted the Guild is handed to guild-init instead of reimplementing adoption; the five clocks of installation state live in a shared canonical block used by both. Tokens and PATs never pass through the skill, and it suggests what to commit without committing. The report ends pointing to rbb catalog, where the team sees what the version that just arrived brought (#967).',
    input:'A repository that already adopted the Guild (no arguments — state is read from disk)', output:'CLI updated, .rbb/config.json completed, .claude/ resynced, hooks reinstalled, rbb doctor green',
    usage:'@.claude/commands/guild-upgrade.md', modes:null, next:null, tags:['setup','upgrade','configure','hooks'] },
  { id:'board-adoption',     type:'skill', name:'board-adoption',     isNew:true,  cat:'planning', catLabel:'Planning',
    desc:'Leva o trabalho em aberto de docs/ para o Azure Boards, uma vez por projeto, na travessia de controle local para board.',
    detail:'The risk this skill exists to avoid is not a wrong card title — it is DOUBLE BOOKKEEPING: the same work living in docs/ and on the board with nobody knowing which one is true. Every step is shaped by that. It inventories only what is still open, and takes the ORDER from the active prioritization snapshot rather than inventing a second one that would compete with the ordering the developer already decided. The checkpoint is an ARTIFACT, not a promise: it emits the JSON that `rbb boards batch` will consume and renders the review markdown FROM that JSON, so approving the readable document is approving the batch — writing both by hand would let the dev approve one thing while the CLI creates another, and the divergence would only surface with the cards already on the board. Pointers are written card by card, the instant each one is created: accumulating them until the end would lose the whole mapping to a dropped connection, leaving cards on the board with no record of which documents had already gone up. Each migrated document becomes a POINTER carrying the card link, never a copy kept alive in both places, and moves to archived/. Running twice cannot duplicate: a document already carrying a Card pointer is skipped. Two rules exist because a real migration proved they could not be left to the judgement of whoever runs it: when the snapshot and the document header disagree about status, the DOCUMENT wins — the snapshot is a photo taken on a date and the document kept being edited after it, and migrating already-finished work is worse than leaving it out because the card is born done and nothing on the board says so. And the final verification rescans the FOLDERS, not the Step 1 inventory: checking against the inventory only asks "did I do what I said I would", which is always yes, while the question that matters is whether any open document was left without a pointer — which is where the decomposition children live, the ones Step 2 deliberately did not turn into cards. Eight of them were once found only because the person running it widened the sweep on their own. It refuses to run while the project still declares mode local, never creates an epic without explicit approval, and never marks itself finished while an open document lacks a pointer — a silent partial migration is the worst outcome, because the developer believes it is done and finds out weeks later with the work already diverged.',
    input:'Épico pai existente + `mode: azure` declarado. Sem o modo, para no Passo 0 — configurar board é do CLI',
    output:'Features e cards no board + docs/board-adoption/adoption_YYYYMMDD.NN.md (o mapeamento documento→card) + cada doc arquivado como ponteiro',
    usage:'@.claude/commands/board-adoption.md', modes:null, next:'planning', tags:['migração','board','backlog','arquivamento'] },
  { id:'feedback',           type:'skill', name:'feedback',           isNew:true,  cat:'review',   catLabel:'Review',
    desc:'Transforma o que acabou de dar errado num registro com evidência carimbada — e barra o erro no projeto quando existe regra mecânica.',
    detail:'O trabalho da skill é TRADUÇÃO: o dev sabe o que deu errado e quase nunca escreve o que deveria ter acontecido, que é justamente o campo que decide se o card vira mudança ou reclamação arquivada. Ela lê a conversa, classifica em erro / melhoria / guarda-errada / guarda-faltando, e puxa o esperado até virar critério utilizável. Antes de perguntar qualquer coisa consulta `rbb feedback`, porque o ledger já guarda candidatos que ninguém precisou escrever: todo --force registrado e toda recusa de guarda repetida no mesmo alvo. A skill NÃO grava o registro — quem grava é o CLI, porque a evidência precisa ser carimbada a partir do disco (head do git, agente do marcador de delegação, caminhos do git status, eventos do ledger); um carimbo escrito pela skill não provaria nada, mesma regra do rbb resume seal. Quando o caso é fronteira de escrita ou nomenclatura, ela propõe o bloqueio: a regra entra em .rbb/project.yaml e passa a valer na próxima execução, cobrada pela guarda (exit 2) ou pelo gate de nomenclatura. Fora desses dois casos diz que vira só reporte, em vez de aceitar --barrar e não barrar nada. E nunca cola código na descrição: o board é compartilhado, o registro cita caminho e comportamento, e o push recusa bloco cercado ou linha copiada de arquivo citado antes de qualquer chamada de rede.',
    input:'A conversa até aqui — nada de formulário; exigir preenchimento no momento da frustração faz o dev desistir de reportar',
    output:'.rbb/feedback/fb_YYYYMMDD.NN.json + Technical Debt no board da plataforma. Não gera documento em docs/',
    usage:'@.claude/commands/feedback.md', modes:null, next:null, tags:['feedback','evidência','guarda','plataforma','AP-010'] }
];

const CLI = [
  { id:'init-backend',    type:'cli', group:'init',   groupLabel:'Projects',    name:'rbb init backend',    desc:'Cria um projeto backend novo a partir dos templates do pacote do CLI, substituindo tokens e aplicando o sourcePattern.',         detail:'Prompts for name and destination directory. Copies the template shipped in the CLI package (dist/plataforma/templates, #969), so only feed access is needed; with platformBranch and templatesRepository it clones as before. Restores the .gitignore and .npmrc names the package had to suffix, replaces {{PROJECT_NAME}}, and renames files/folders with the project name.',                                                                     usage:'rbb init backend [--stack net]',                                  prereq:null, tags:['backend','template','net'] },
  { id:'init-frontend',   type:'cli', group:'init',   groupLabel:'Projects',    name:'rbb init frontend',   desc:'Cria um projeto frontend novo com template Angular pré-configurado, renomeando todos os artefatos para o nome do projeto.', detail:'Applies 3 sourcePattern variants: original, kebab-case, and PascalCompact — ensures all name formats used by Angular are replaced.',                                                                          usage:'rbb init frontend [--stack angular]',                             prereq:null, tags:['frontend','angular','template'] },
  { id:'init-fullstack',  type:'cli', group:'init',   groupLabel:'Projects',    name:'rbb init fullstack',  desc:'Cria um projeto fullstack composto (backend, frontend e a cola do Docker) num único fluxo interativo.',            detail:'Combines backend, frontend, and fullstack templates. Applies sourcePattern for both and configures docker-compose to bring everything up with a single command.',                                                  usage:'rbb init fullstack',                                              prereq:null, tags:['fullstack','docker','template'] },
  { id:'init-list',       type:'cli', group:'init',   groupLabel:'Projects',    name:'rbb init -l',         desc:'Lista os templates que vêm no pacote do CLI, por tipo: backend, frontend e fullstack.',              detail:null,                                                                                                                                                                                               usage:'rbb init -l',                                                     prereq:null, tags:['templates','stacks'] },
  { id:'sync-prompts',    type:'cli', group:'sync',   groupLabel:'Sync',        name:'rbb sync prompts',    desc:'Remove os slash commands antigos de prompts/ do projeto: a pasta deixou de ser entregue, o caminho vivo são as skills.',                          detail:'prompts/ is no longer delivered as slash commands (they competed with the skills, one overwrote the card description, and platform reviews reached the client). The command only removes what a previous sync installed, using the manifest, and leaves skills and agents alone (#921).',                                                                         usage:'rbb sync prompts [--global]',                                     prereq:null, tags:['prompts','sync'] },
  { id:'sync-skills',     type:'cli', group:'sync',   groupLabel:'Sync',        name:'rbb sync skills',     desc:'Sincroniza as skills e o shared/ que vêm no pacote do CLI para o cache local da máquina, sem clonar nada.',                    detail:'Copies skills/ and shared/ from the installed CLI package (dist/plataforma, #969) and stamps origem pacote, the CLI version and the build sha. Only with platformBranch or RBB_PLATFORM_BRANCH it temporarily clones that branch of the engineeringRepository instead. A CLI without the platform fails before touching anything. Overwrites the local version. Writes only .claude/commands/: the Copilot prompts under .github/prompts/ are no longer generated, and what a previous sync put there is removed through its manifest, leaving team files alone (#967). Each skill command written to .claude/commands/ opens with a model: frontmatter read from the <!-- modelo: haiku|sonnet|opus|inherit --> marker of its prompt.md, so a skill called directly runs on the declared model; inherit is for the analysis skills whose model depends on the flow size (#957).',                                                                           usage:'rbb sync skills [--global]',                                      prereq:null, tags:['skills','sync'] },
  { id:'sync-agents',     type:'cli', group:'sync',   groupLabel:'Sync',        name:'rbb sync agents',     isNew:true, desc:'Sincroniza o catálogo de agentes para o cache local e os instala em .claude/agents/ do projeto ativo.', detail:'Copies agents/ from the installed CLI package (#969); only with platformBranch it clones the engineeringRepository instead. Writes each agent file to .claude/agents/. Tracked in .rbb-sync-manifest.json under the agents section.',                        usage:'rbb sync agents [--global]',                                      prereq:null, tags:['agents','sync'] },
  { id:'sync-pipeline',   type:'cli', group:'sync',   groupLabel:'Sync',        name:'rbb sync pipeline',   isNew:true, desc:'Copia os templates de pipeline do pacote do CLI para azure-pipelines/guild/ do projeto, e migra a pipe que ainda usa @templates.', detail:'The Azure pipeline templates ship in the CLI package (#969). rbb sync pipeline copies stages/ and steps/ into azure-pipelines/guild/, versioned in the project, with a manifest holding a hash of each file (CRLF normalized, so the Windows autocrlf does not look like an edit). A file the team edited is never overwritten nor removed: it is listed and the sync exits 0. rbb sync all updates the folder only where it already exists and never creates it. --migrar prints the diff that turns each azure-pipelines/...yml@templates reference into the absolute /azure-pipelines/guild/ path and drops the templates resource when nothing else uses it; --aplicar writes it, after copying the templates. A CLI without the templates exits 1 telling to run rbb update and touches nothing (#971).', usage:'rbb sync pipeline  ·  rbb sync pipeline --migrar  ·  rbb sync pipeline --migrar --aplicar', prereq:null, tags:['pipeline','azure','templates','sync'] },
  { id:'sync-all',        type:'cli', group:'sync',   groupLabel:'Sync',        name:'rbb sync all',        desc:'Instala no projeto as skills e os agentes da versão do CLI, sem clonar nada, e remove o que syncs antigos deixaram. É a rotina recomendada para manter tudo em dia de uma vez.',  detail:'No longer syncs prompts: it removes the old prompts/ slash commands from the project. It no longer writes .github/prompts/ either, since in Copilot a skill ran with no write guard: the files the manifest lists are removed, team files stay, and the folder goes only when empty (#967). Agents sync is graceful — if it fails, it warns and continues without failing. Skills, agents and shared/ come from the installed CLI package (#969): the output says Skills da versao X do CLI, a skill fix arrives with rbb update, and a CLI without the platform exits 1 telling to run rbb update with the project untouched. Only with platformBranch it clones, and only then it warns when the CLI is behind the feed, since cloned skills may cite commands that version lacks (#927). A failed agents sync says the real reason. Skill commands carry the model: frontmatter of their prompt.md marker (#957).',                                                                                                 usage:'rbb sync all [--global]',                                         prereq:null, tags:['sync','prompts','skills','agents'] },
  { id:'boards-configure',type:'cli', isNew:true, group:'boards', groupLabel:'Azure Boards',name:'rbb boards configure',desc:'Declara como o projeto controla demandas (local ou Azure Boards) e, no azure, a conexão, o tipo do board e os nomes dos estados. Grava em .rbb/boards.json, com prompt ou só por flags, e a base de onde o time cria branch, lida do histórico.', detail:'Interactive by default: asks for the mode, then organization, project, the NAME of the PAT environment variable, board type (Basic/Agile/Scrum/Custom) and state names. With --mode it never prompts, which is what an agent shell without stdin needs (#901): --mode local, or --mode azure with --org, --project (both read from an Azure DevOps git remote when omitted), --pat-env, --type, --parent-active and a repeatable --state key=State that overrides one state of the preset. An invalid flag rejects the whole call and nothing is written. Fields the command does not ask about, such as delivery and base, survive a reconfiguration. --base records the branch the team creates work branches from, which the branch guard judges against (#968): auto reads it from history (the last 40 first-parent merges of develop and main, a merge is integration when its second parent is on the first-parent line of the other; the base is the only branch with at least 3 work merges and 80 percent of its merges), a single integration branch wins outright, and a tie exits 1 writing nothing and prints the question for the developer, whose answer is recorded with --base <branch>. A branch missing from origin is refused with the list of existing candidates. Works without --mode, keeping the rest of the file. Writes the .rbb/ rules into .gitignore.',                                                                                   usage:'rbb boards configure  |  rbb boards configure --mode local  |  rbb boards configure --mode azure --pat-env AZURE_TEAM_ADM_EXT_PAT --type custom  |  rbb boards configure --base auto',                                            prereq:null, tags:['azure','config','pat','board-type','states'] },
  { id:'boards-states', type:'cli', isNew:true, group:'boards', groupLabel:'Azure Boards',name:'rbb boards states',  desc:'Mostra, em JSON, o mapeamento de nomes de estado do board configurado para este repositório.',                           detail:'Skills call this command to discover the correct state names (e.g. "Refined", "Doing", "Done") for the current project board type, avoiding hardcoded state names.',                                                                                                                            usage:'rbb boards states',                                               prereq:'rbb boards configure executed', tags:['azure','states','board-type','config'] },
  { id:'boards-test',     type:'cli', group:'boards', groupLabel:'Azure Boards',name:'rbb boards test',     desc:'Testa a conexão com o Azure DevOps usando as credenciais configuradas.',                                            detail:null,                                                                                                                                                                                               usage:'rbb boards test',                                                 prereq:'rbb boards configure executed', tags:['azure','connection','test'] },
  { id:'boards-create',   type:'cli', group:'boards', groupLabel:'Azure Boards',name:'rbb boards create',   desc:'Cria um único work item no board: Epic, Feature, User Story, Task ou Bug.',                         detail:'A Feature is refused without --parent, or with a parent that is not an Epic: a Feature never exists without an Epic, and nothing is created (#749). A parent of another kind only warns, since not every board uses Epic, Feature and item. The parent link goes in the same request, so no orphan card when linking fails; a suspicious hierarchy is refused unless --hierarquia-livre (#913). With an active orchestrator flow, a card is only created when the open step executes an approved proposal (dispatch --executa); otherwise it is refused before any board read, and the message points to --executa and to parking the finding. --decisao from the developer passes and is recorded as guarda.forcada card-no-fluxo, only after the input is validated and right before the card is created, so an invalid type or a refused parent leaves nothing in the ledger (#960). Paused, stopped, concluded or no flow: nothing changes (#952).',                                                                                                                                                                                               usage:'rbb boards create "User Story" --title "..." --parent 1234 [--hierarquia-livre] [--decisao "<motivo>"]',      prereq:'rbb boards configure executed', tags:['azure','work item','create'] },
  { id:'boards-batch',    type:'cli', group:'boards', groupLabel:'Azure Boards',name:'rbb boards batch',    desc:'Cria vários work items a partir de um arquivo JSON num comando só, com uma aprovação apenas. Aceita parentRef para montar a hierarquia, e recusa o lote inteiro quando ela está errada.',  detail:'A Feature without an Epic parent is refused with no flag to bypass it, unlike the suspicious-hierarchy check that --hierarquia-livre releases (#749). Resolves parentRef at runtime (parent before children in the array). Displays a clickable link to the main card. --delete-after option removes the JSON after creation. The hierarchy of the whole file is checked BEFORE any card is written, like the file validation: suspicious means zero writes. A refinement run at the wrong level once proposed 33 Tasks hanging directly from an Epic, and nothing would have said a word: the warning lived only in boards create, one card at a time, while skills publish through this command. Here it refuses instead of warning, because undoing 33 cards in the wrong parent costs far more than refusing; --hierarquia-livre is the explicit way out for a board that uses another model on purpose. A parent whose type cannot be read is not turned into suspicion. A Task carries its single owner in the agente field, written to the board as the tag agente:<name>; more than one owner, in the field or in hand-written tags, rejects the whole file before any card is created (#733). An item may carry complexidade (baixa, media or alta), written as the tag complexidade:<x> that flow dispatch reads to pick the model; a Task without it only warns, and a value outside the list rejects the file (#957). Items are created already linked to the parent, and an agente that does not exist in .claude/agents/ refuses the whole batch (#913). With an active orchestrator flow, a card is only created when the open step executes an approved proposal (dispatch --executa); otherwise it is refused before any board read, and the message points to --executa and to parking the finding. --decisao from the developer passes and is recorded as guarda.forcada card-no-fluxo, only after the whole file is validated and right before the first card, so an invalid batch leaves nothing in the ledger (#960). Paused, stopped, concluded or no flow: nothing changes (#952). An item may declare the layers it touches in camadas, written as camada:<x> tags; the owner must be one of them and every layer must exist in the profile. Splitting is by owner, not by layer, and in a flow of size P a Task item is refused: the card is the unit (#956).',                              usage:'rbb boards batch batch.json --delete-after [--decisao "<motivo>"]  ·  item: { "type":"Task", "title":"...", "agente":"dev-domain", "camadas":["domain","application"], "parentRef":"PARENT" }',                      prereq:'rbb boards configure executed', tags:['azure','batch','hierarchy','bulk'] },
  { id:'boards-get',      type:'cli', group:'boards', groupLabel:'Azure Boards',name:'rbb boards get',      desc:'Lê um work item por ID e mostra título, tipo, estado, descrição, critérios de aceite, Discussion e URL.',        detail:'Use --full to show complete description and acceptance criteria without the 120-char truncation. Use --json for raw JSON output useful in scripts and skill integrations (comments come in the comments field: null when they could not be read, empty when there are none). The Discussion is always printed in full, as plain text, because it is where the developer corrects what the description says (#787); a card without comments prints no Discussion section, and a failed read is reported instead of passing for empty.',                                                                                                                                    usage:'rbb boards get 1234 --full',                                      prereq:'rbb boards configure executed', tags:['azure','work item','read'] },
  { id:'boards-finish-merged', type:'cli', group:'boards', groupLabel:'Azure Boards', name:'rbb boards finish-merged', isNew:true, desc:'Conclui os cards citados no título dos commits do PR que acabou de entrar, pelas mesmas guardas do finish.',detail:'Work done outside the orchestrator never closed its card: #811, #899 and #900 stayed in Doing with the work already on main, because the on-merge half of #781 only existed in rbb flow end (#934). The command reads the PR that just entered: a merge commit means HEAD^1..HEAD^2, a squash (Merged PR ...) uses the lines of the message body, a direct push uses the commit itself; --intervalo overrides it. Only the TITLE of each commit counts - a number in the body is context, and finishing context cards would close work that is not this PR. Each card goes through the same walk as rbb boards finish, so the R1 guard keeps a card with open children open and the command reports it, adding a pipeline warning when TF_BUILD is set. Cards of another project and cards already closed are skipped. Exit code is 0 whenever the board answered, because failing the pipeline after a merge only teaches people to ignore red; board unreachable or no PAT exits 1. Meant for the develop pipeline.',usage:'rbb boards finish-merged  ·  rbb boards finish-merged --intervalo origin/main..HEAD --dry-run',prereq:'.rbb/boards.json com mode azure', tags:['board','state','pipeline','merge'] },
  { id:'boards-start',    type:'cli', group:'boards', groupLabel:'Azure Boards',name:'rbb boards start',    desc:'Move um card para o estado de trabalho, percorrendo cada degrau obrigatório pelas mesmas guardas, e recusa card em New que não foi refinado.',detail:'Born from feedback card #265, where a Technical Enabler was implemented end to end - code, tests, gates, E2E, six commits - with the card sitting in New the whole time. Part of the reason is that moving a card correctly meant knowing the sequence (New to Refined to Doing), three separate calls, and whoever did not know found out by being refused. This walks it in one command. It is not a shortcut: every step goes through the SAME transition guards as rbb boards update, and the command never passes --force on its own. Steps already passed are skipped rather than failing, because a command that errors for being already correct teaches people not to use it. A refusal stops the walk where it happened and is recorded in the ledger. rbb boards finish closes the card the same way. It also records the card and its ancestors in .rbb/trabalho.json, in any delivery grain, so the write guard accepts a branch named after the US, Feature or Epic that contains the card (#729). A branch with no relation to that hierarchy is a persistent barrier, not a one-time warning: repeating the write no longer passes. The way out belongs to the dev: switch branch, or run --confirmar-branch, which binds the current branch to this card and is recorded in the ledger. A subagent running that flag is refused by the shell guard. A started child moves a work-item parent (US, TE, TD, Bug) to the active state of its type, and Epic/Feature to parent.active; a US/TE/TD/Bug parent still in New is reported, not moved (#912, #933). A card still in New was never refined, so start refuses it (Bug: run bug-triage first); only the developer can pass --sem-refinamento, which is recorded in the ledger and refused to a subagent by the shell guard (#933). The camada:<x> tags of the card go to .rbb/trabalho.json as camadas: the write guard reads them there, on the hot path, and lets the agent write in the declared layers when its own layer is declared too (#956). In mode local there is no board to move: start exits 0 saying so and records nothing, finish exits 1 pointing to closing the document in docs/, and verify-branch and finish-merged exit 0 with nothing to check - none of them sends the dev to rbb boards configure, which would switch the project mode (#965).',usage:'rbb boards start 265  |  rbb boards start 722 --confirmar-branch  |  rbb boards start 265 --sem-refinamento  |  rbb boards finish 265', prereq:'.rbb/boards.json with mapped states', tags:['boards','workflow','guard'] },
  { id:'boards-verify',   type:'cli', group:'boards', groupLabel:'Azure Boards',name:'rbb boards verify-branch', desc:'Gate bloqueante: recusa uma branch cujos commits não estão ligados a um card que já saiu de New e de Refined, e do projeto deste board.',detail:'A card cited in a commit TITLE is a work card and each one must be started; a card cited only in the body is context and does not cover it. Before, one started card anywhere was enough, so context cards cited in the body (already started by other work) covered work cards left in New (#781). Without any card in a title, the old rule applies. The instruction to move a card existed - inside the implementation skill. But a rule that only lives inside a skill does not reach whoever works outside it, which is exactly how card #264 got built with its own card untouched. The commit is the only chokepoint found: the skill misses whoever does not use it, the CLI misses whoever edits files directly, but all work becomes a commit. The gate requires at least one commit in the branch to reference a card, and refuses when any referenced card is still in the board initial state - work committed is work started. Merge commits are excluded on purpose: a merged pull request message carries the PR number, not a card, and counting it would turn the gate green without anyone having referenced a card. main, master and develop are exempt because they receive PR merges and the work was already checked at its origin. The initial state comes from the configured preset rather than a hardcoded New, so it also works on basic and agile boards. It needs full history in CI - with a shallow clone the comparison cannot resolve and the gate would fail for ENVIRONMENT rather than defect, which is how a gate loses credibility (AP-013); that case fails loudly saying what to fix. What it deliberately is NOT: prevention. It catches after the fact - the card leaves New when you commit, not when you start. A card from another project of the organization does not count, and a card still in Refined is not started either (#914).',usage:'rbb boards verify-branch --base origin/main --branch <nome>', prereq:'Full history (fetchDepth 0) and board access', tags:['boards','gate','ci','AP-013'] },
  { id:'boards-update',   type:'cli', group:'boards', groupLabel:'Azure Boards',name:'rbb boards update',   desc:'Atualiza campos de um work item existente: título, descrição, critérios de aceite, prioridade, estado (pelo nome ou pelo slot, como refined) e tags, e o stack rank para ordenar o backlog.',   detail:'Supports --stack-rank to control card position in the Azure Boards backlog (lower value = higher priority). Used by the prioritization skill to reorder cards after running a priority session. State changes pass through two guards: an Epic/Feature cannot be closed while it still has open children, and a US/TE/TD cannot jump from the initial state straight to active, skipping refinement. The refinement guard only applies to boards that actually have a refinement state. Use --force to override — the bypassed reason is printed, never silenced. --state also accepts a platform slot in lowercase (new, refined, active, done, approve, closed): the CLI translates it to this board and to the card type (#918).',                                                                                                               usage:'rbb boards update 1234 --stack-rank 10  ·  rbb boards update ID --state refined',                          prereq:'rbb boards configure executed', tags:['azure','work item','update','priority','stack-rank'] },
  { id:'boards-link',     type:'cli', group:'boards', groupLabel:'Azure Boards',name:'rbb boards link',     desc:'Cria a relação de pai e filho entre dois work items existentes.',                                           detail:null,                                                                                                                                                                                               usage:'rbb boards link --parent 1234 --child 1235',                      prereq:'rbb boards configure executed', tags:['azure','link','hierarchy'] },
  { id:'boards-list',     type:'cli', group:'boards', groupLabel:'Azure Boards',name:'rbb boards list',     desc:'Lista os work items do projeto, por padrão tudo menos Closed; com --abertos, tira também Done e Removed. Sem o corte em 50 que escondia metade do board.',detail:'Lists up to 1000 items and warns when more matched, saying how to filter with --state, --type or --abertos. Values typed in the filters are escaped, so a quote in a state or type no longer breaks the query.',                                                                                                                                                                                               usage:'rbb boards list  ·  rbb boards list --abertos',                       prereq:'rbb boards configure executed', tags:['azure','list','work items'] },
  { id:'boards-comment',  type:'cli', isNew:true, group:'boards', groupLabel:'Azure Boards',name:'rbb boards comment',  desc:'Publica um comentário na Discussion do work item. Usado pelo code-review para registrar achados sem sobrescrever a descrição.', detail:'Accepts HTML in --body so comments render with rich formatting in Azure Boards. Works on any work item type (US, TE, TD, Feature, Epic). Used by the code-review skill to post review results and by the tech-lead agent to post consolidated Feature-level summaries.',                     usage:'rbb boards comment 1234 --body "<b>Review</b>..."',               prereq:'rbb boards configure executed', tags:['azure','comment','discussion','code-review'] },
  { id:'boards-search',   type:'cli', group:'boards', groupLabel:'Azure Boards',name:'rbb boards search',   desc:'Busca work items pelo texto do título via WIQL. Serve para achar o Épico ou a Feature pai antes de criar um card.',detail:'No silent 50-item cut: the same listing limit and warning as boards list.',usage:'rbb boards search "authentication"',                               prereq:'rbb boards configure executed', tags:['azure','search','wiql'] },
  { id:'configure',       type:'cli', group:'utils',  groupLabel:'Utilities',   name:'rbb configure',       desc:'Configura o feed do CLI para ESTE repositório, gravando em .rbb/config.json; as URLs dos repositórios ficam para quem desenvolve a plataforma.',            detail:'Config is per repository, not global, so a dev working across clients points each repo at its own platform. The file carries no secret — the Azure DevOps PAT comes from an environment variable — so it is meant to be committed: whoever clones the repo is already configured. A legacy ~/.rbb/config.json is still read as a fallback, with a warning, and any PAT stored there is never propagated. Only cliRegistry is required: the platform ships in the CLI package (#969). engineeringRepository is required only with platformBranch, when sync clones; templatesRepository never is. The interactive mode asks only the feed, plus the two repository URLs when platformBranch is set. skillsRepository and agentsRepository pointed at the same monorepo and were folded into engineeringRepository: an old config is still read and is rewritten with the new key on the next save, and --monorepo, --skills-repository and --agents-repository became deprecated synonyms that warn; two of them with different values are refused and nothing is written (#967). Every key also has a non-interactive flag (--cli-registry, --templates-repository, --engineering-repository, --platform-branch) so the guild-upgrade skill can write what the developer answered in chat; an invalid value refuses the whole call. --show prints the effective config as JSON with missing and legacy keys, and never the PAT. --feedback-pat-env records the NAME of the env var for the platform board PAT used by rbb feedback push; a value that looks like a token is refused (#911).',                                                                                                                                                                                               usage:'rbb configure  ·  rbb configure --show  ·  rbb configure --cli-registry <url> --engineering-repository <url>  ·  rbb configure --feedback-pat-env NOME',                                                   prereq:null, tags:['config','repositories'] },
  { id:'flow',            type:'cli', isNew:true, group:'utils',  groupLabel:'Utilities',   name:'rbb flow',            desc:'Grava o fluxo que o orquestrador conduz: etapas, aprovações, recusas, ajustes e a autonomia que vem do time ou de um plano aprovado. O registro viaja com a branch.',   detail:'flow check-pr is the pull request gate for develop and main: it fails while .rbb/fluxo.json is tracked in the branch. It lives in the CLI so every CI calls the same check; it used to exist only in the Azure Pipelines template, and a GitHub Actions project let the flow reach develop twice (#831, #898). dispatch --executa <n> binds a step to the APPROVED proposal of step n: the approval belongs to the proposal, identified by the step rather than by the card, so the po creating the card approved in a planning opened on a parent card no longer asks the developer twice; record --autonomo accepts it as a base, and dispatch refuses --executa for a step that was not approved (#834). In mode azure, flow end also discards the flow documents whose content lives on the board (backlog, planning, refinement, code-review, todos: the ones its steps recorded and the ones named after a card of the flow, archived included). Analysis documents stay, mode local discards nothing, and --manter-docs skips it (#783). flow end also finishes on the board what the flow executed: Tasks an approved implementation step ran, then the work items (User Story, Technical Enabler, Technical Debt, Bug); Feature and Epic stay. Every move goes through the same guarded path as boards finish, so an item still holding a Task the flow did not run is reported as open instead of closed by proxy; --sem-board skips it (#784). In mode local there is no board, so flow end does the same with the documents in docs/: backlog and refinement of each executed item get Status ✅ Concluído and move to the archived/ subfolder of their folder, and Feature and Epic follow when every declared child is done. Only the header Status l
