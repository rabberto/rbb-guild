name: Dúvida
description: Você não sabe como fazer algo com o Guild.
title: "[dúvida] "
labels: ["duvida", "triagem"]
body:
  - type: markdown
    attributes:
      value: |
        > Antes de abrir: `/guild-help` no Claude Code e `rbb catalog` no terminal
        > mostram o que cada skill e comando faz.
        >
        > **Esta issue é pública.** Não cole código ou nome de cliente, tokens, PATs
        > nem URLs internas.

  - type: textarea
    id: objetivo
    attributes:
      label: O que você quer fazer
    validations:
      required: true

  - type: textarea
    id: tentativa
    attributes:
      label: O que você já tentou
      description: Skills ou comandos que rodou, e o que eles responderam.
    validations:
      required: true

  - type: input
    id: versao
    attributes:
      label: Versão do CLI
      description: Opcional. Saída de `rbb version`.

  - type: checkboxes
    id: publico
    attributes:
      label: Conteúdo público
      options:
        - label: Revisei o texto e não há código de cliente, token ou URL interna.
          required: true
